# ==========================================
# Application
# ==========================================
spring.application.name=HourBook

# ==========================================
# Aiven MySQL Database
# ==========================================
spring.datasource.url=jdbc:mysql://hourbook-mysql-vikasgabale9-f219.b.aivencloud.com:17061/hourbook?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Server Configuration
# ==========================================
server.port=${PORT:8989}
server.address=0.0.0.0

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# Razorpay
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ==========================================
# Email / OTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# JWT Authentication
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==========================================
# Spring Security
# ==========================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ==========================================
# Booking Configuration
# ==========================================
hourbook.booking.pending-timeout-minutes=15
hourbook.booking.expiry-check-ms=60000

#===================================
#Resend
#===================================

resend.from=${RESEND_FROM:onboarding@resend.dev}


#=======================================================================================
#Logging
#========================================================================================
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator=DEBUG
logging.level.org.springframework.boot.context.config=INFO



# Reduce database connections for Render free instance
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Reduce startup and connection delays
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=20000

# Disable unnecessary JPA open-in-view behavior
spring.jpa.open-in-view=false

#=================================================================
#  +++++++++++++++CLOUDINARY+++++++++++++++++++++
#=================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}