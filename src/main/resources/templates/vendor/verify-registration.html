<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Verify Vendor Registration | HourBook</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-card {
            width: 420px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
        }

        .otp-header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .otp-icon {
            font-size: 48px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
        }

        .otp-body {
            background: white;
            padding: 32px;
        }

        .otp-input {
            height: 55px;
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            border-radius: 10px;
        }

        .verify-btn {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="card otp-card">

    <div class="otp-header">

        <div class="otp-icon">

            <i class="bi bi-shield-lock"></i>

        </div>

        <div class="brand">
            HourBook
        </div>

        <div>
            Verify Vendor Registration
        </div>

    </div>

    <div class="otp-body">

        <div class="text-center mb-4">

            <p class="text-muted mb-1">
                We sent a verification OTP to
            </p>

            <strong th:text="${email}">
                vendor@example.com
            </strong>

        </div>

        <!-- ERROR -->

        <div
            th:if="${error}"
            class="alert alert-danger">

            <i class="bi bi-exclamation-triangle me-2"></i>

            <span th:text="${error}">
                Invalid OTP
            </span>

        </div>

        <form
            th:action="@{/vendor/verify-registration}"
            th:object="${otpRequest}"
            method="post">

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Enter OTP
                </label>

                <input
                    type="text"
                    th:field="*{otp}"
                    class="form-control otp-input"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="000000"
                    required>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('otp')}"
                    th:errors="*{otp}">
                </div>

            </div>

            <button
                type="submit"
                class="btn btn-primary verify-btn w-100">

                <i class="bi bi-check-circle me-2"></i>

                Verify OTP

            </button>

        </form>

        <div class="text-center mt-4">

            <a
                th:href="@{/vendor/register}"
                class="text-decoration-none">

                <i class="bi bi-arrow-left me-1"></i>

                Back to Registration

            </a>

        </div>

    </div>

</div>

</body>

</html>
