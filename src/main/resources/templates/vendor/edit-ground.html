<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Ground | HourBook</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{vendor/fragments/sidebar :: sidebar}"></div>

<div style="margin-left:260px;">

    <div th:replace="~{vendor/fragments/header :: header}"></div>

    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>
                <i class="bi bi-pencil-square"></i>
                Edit Ground
            </h2>

            <a th:href="@{/vendor/grounds}"
               class="btn btn-secondary">
                Back
            </a>

        </div>

        <div class="card shadow border-0">

            <div class="card-body">

                <form
                        th:action="@{/vendor/grounds/edit/{id}(id=${ground.id})}"
                        th:object="${ground}"
                        method="post"
                        enctype="multipart/form-data">

                    <input type="hidden" th:field="*{id}">

                    <!-- BASIC DETAILS -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Ground Name
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{name}">

                            <small class="text-danger"
                                   th:errors="*{name}">
                            </small>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{location}">

                            <small class="text-danger"
                                   th:errors="*{location}">
                            </small>

                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Sports
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{sports}">

                            <small class="text-danger"
                                   th:errors="*{sports}">
                            </small>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Price Per Hour
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    ₹
                                </span>

                                <input
                                        type="number"
                                        step="0.01"
                                        min="1"
                                        class="form-control"
                                        th:field="*{pricePerHour}">

                            </div>

                            <small class="text-danger"
                                   th:errors="*{pricePerHour}">
                            </small>

                        </div>

                    </div>


                    <!-- OPERATING HOURS -->

                    <div class="card border mb-4">

                        <div class="card-header bg-light">

                            <strong>
                                <i class="bi bi-clock"></i>
                                Ground Operating Hours
                            </strong>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <!-- Opening Time -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Opening Time
                                    </label>

                                    <input
                                            type="time"
                                            class="form-control"
                                            th:field="*{openingTime}">

                                    <small
                                            class="text-danger"
                                            th:errors="*{openingTime}">
                                    </small>

                                </div>


                                <!-- Closing Time -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Closing Time
                                    </label>

                                    <input
                                            type="time"
                                            class="form-control"
                                            th:field="*{closingTime}">

                                    <small
                                            class="text-danger"
                                            th:errors="*{closingTime}">
                                    </small>

                                </div>

                            </div>


                            <!-- SLOT DURATION -->

                            <div>

                                <label class="form-label">
                                    Booking Slot Duration
                                </label>

                                <div class="input-group">

                                    <input
                                            type="number"
                                            th:field="*{slotDurationMinutes}"
                                            class="form-control"
                                            readonly>

                                    <span class="input-group-text">
                                        Minutes
                                    </span>

                                </div>

                                <small class="text-muted">

                                    HourBook currently uses fixed
                                    60-minute booking slots.

                                </small>

                            </div>

                        </div>

                    </div>


                    <!-- GROUND TYPE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Ground Type
                        </label>

                        <select
                                class="form-select"
                                th:field="*{type}">

                            <option value="">
                                Select Type
                            </option>

                            <option
                                    th:each="type : ${T(com.app.hourbook.enums.GroundType).values()}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>

                        </select>

                        <small class="text-danger"
                               th:errors="*{type}">
                        </small>

                    </div>


                    <!-- AMENITIES -->

                    <div class="mb-3">

                        <label class="form-label">
                            Amenities
                        </label>

                        <div class="row">

                            <div
                                    class="col-md-4"
                                    th:each="amenity : ${T(com.app.hourbook.enums.Amenities).values()}">

                                <div class="form-check">

                                    <input
                                            class="form-check-input"
                                            type="checkbox"
                                            th:field="*{amenities}"
                                            th:value="${amenity}">

                                    <label
                                            class="form-check-label"
                                            th:text="${amenity}">
                                    </label>

                                </div>

                            </div>

                        </div>

                        <small class="text-danger"
                               th:errors="*{amenities}">
                        </small>

                    </div>


                    <!-- CURRENT IMAGES -->

                    <div class="mb-3"
                         th:if="${ground.imageUrls != null and !ground.imageUrls.isEmpty()}">

                        <label class="form-label">
                            Current Images
                        </label>

                        <div>

                            <img
                                    th:each="img : ${ground.imageUrls}"
                                    th:src="@{${img}}"
                                    width="140"
                                    height="100"
                                    style="object-fit: cover;"
                                    class="rounded border me-2 mb-2">

                        </div>

                    </div>


                    <!-- NEW IMAGES -->

                    <div class="mb-4">

                        <label class="form-label">
                            Upload New Images
                        </label>

                        <input
                                type="file"
                                class="form-control"
                                multiple
                                accept="image/*"
                                th:field="*{images}">

                        <small class="text-muted">
                            Uploading new images will replace the current images
                            according to your current service logic.
                        </small>

                    </div>


                    <!-- BUTTONS -->

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-save"></i>
                        Update Ground

                    </button>

                    <a
                            th:href="@{/vendor/grounds}"
                            class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

    <div th:replace="~{vendor/fragments/footer :: footer}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
