<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Vendor Registration | HourBook</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
        }

        .register-header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .logo {
            font-size: 42px;
        }

        .brand {
            font-size: 30px;
            font-weight: 700;
        }

        .register-body {
            background: white;
            padding: 32px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .form-label {
            font-weight: 600;
        }

        .register-btn {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="card register-card">

    <!-- HEADER -->

    <div class="register-header">

        <div class="logo">
            <i class="bi bi-building"></i>
        </div>

        <div class="brand">
            HourBook
        </div>

        <div>
            Vendor Registration
        </div>

    </div>

    <!-- BODY -->

    <div class="register-body">

        <!-- ERROR -->

        <div
            th:if="${error}"
            class="alert alert-danger">

            <i class="bi bi-exclamation-triangle me-2"></i>

            <span th:text="${error}">
                Registration failed.
            </span>

        </div>

        <form
            th:action="@{/vendor/register}"
            th:object="${vendorRegister}"
            method="post">

            <!-- FULL NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        th:field="*{fullName}"
                        class="form-control"
                        placeholder="Enter your full name">

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('fullName')}"
                    th:errors="*{fullName}">
                </div>

            </div>

            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        th:field="*{email}"
                        class="form-control"
                        placeholder="Enter email">

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}">
                </div>

            </div>

            <!-- PHONE -->

            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-phone"></i>
                    </span>

                    <input
                        type="text"
                        th:field="*{phoneNumber}"
                        class="form-control"
                        maxlength="10"
                        inputmode="numeric"
                        placeholder="10 digit mobile number">

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('phoneNumber')}"
                    th:errors="*{phoneNumber}">
                </div>

            </div>

            <!-- PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        th:field="*{password}"
                        id="password"
                        class="form-control"
                        placeholder="Create password">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        onclick="togglePassword('password','passwordIcon')">

                        <i
                            class="bi bi-eye"
                            id="passwordIcon">
                        </i>

                    </button>

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}">
                </div>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="mb-4">

                <label class="form-label">
                    Confirm Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input
                        type="password"
                        th:field="*{confirmPassword}"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm password">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        onclick="togglePassword('confirmPassword','confirmPasswordIcon')">

                        <i
                            class="bi bi-eye"
                            id="confirmPasswordIcon">
                        </i>

                    </button>

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('confirmPassword')}"
                    th:errors="*{confirmPassword}">
                </div>

            </div>

            <!-- BUTTON -->

            <button
                type="submit"
                class="btn btn-primary register-btn w-100">

                <i class="bi bi-person-plus me-2"></i>

                Register as Vendor

            </button>

        </form>

        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a
                th:href="@{/vendor/login}"
                class="fw-semibold text-decoration-none">

                Login

            </a>

        </div>

        <div class="text-center mt-3">

            <a
                th:href="@{/}"
                class="text-muted text-decoration-none">

                <i class="bi bi-arrow-left me-1"></i>

                Back to Home

            </a>

        </div>

    </div>

</div>

<script>

function togglePassword(fieldId, iconId) {

    const field =
        document.getElementById(fieldId);

    const icon =
        document.getElementById(iconId);

    if (field.type === "password") {

        field.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        field.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");
    }
}

</script>

</body>

</html>
