<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Vendor Profile</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/vendor.css}">
</head>

<body class="bg-light">

<!-- Sidebar -->
<div th:replace="~{vendor/fragments/sidebar :: sidebar}"></div>


<!-- Main Content -->
<div style="margin-left:260px;">

    <!-- Header -->
    <div th:replace="~{vendor/fragments/header :: header}"></div>


    <div class="container-fluid p-4">

        <!-- Page Title -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    <i class="bi bi-person-circle text-primary"></i>
                    Vendor Profile
                </h2>

                <p class="text-muted mb-0">
                    View your account information
                </p>

            </div>

            <a th:href="@{/vendor/profile/edit}"
               class="btn btn-primary">

                <i class="bi bi-pencil-square"></i>

                Edit Profile

            </a>

        </div>


        <div class="row">

            <!-- Profile Card -->
            <div class="col-lg-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">


						<!-- Profile Image -->
						<img th:if="${vendor.profileImage != null
						             and !#strings.isEmpty(vendor.profileImage)}"
						     th:src="${vendor.profileImage}"
						     class="rounded-circle mb-3 border"
						     width="140"
						     height="140"
						     style="object-fit: cover;"
						     alt="Vendor Profile">

						<!-- Default Image -->
						<img th:unless="${vendor.profileImage != null
						                 and !#strings.isEmpty(vendor.profileImage)}"
						     src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
						     class="rounded-circle mb-3 border"
						     width="140"
						     height="140"
						     style="object-fit: cover;"
						     alt="Default Profile">

                        <!-- Name -->
                        <h4 th:text="${vendor.fullName}">
                            Vendor Name
                        </h4>


                        <p class="text-muted">
                            Vendor
                        </p>


                        <!-- Active -->
                        <span class="badge bg-success"
                              th:if="${vendor.active}">

                            Active

                        </span>


                        <!-- Inactive -->
                        <span class="badge bg-danger"
                              th:unless="${vendor.active}">

                            Inactive

                        </span>

                    </div>

                </div>

            </div>


            <!-- Details -->
            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-header bg-primary text-white">

                        <i class="bi bi-person-vcard me-2"></i>

                        Personal Information

                    </div>


                    <div class="card-body">

                        <table class="table table-bordered align-middle">

                            <tbody>


                            <!-- Vendor ID -->
                            <tr>

                                <th width="30%">
                                    Vendor ID
                                </th>

                                <td th:text="${vendor.vendorAuth.id}">
                                    -
                                </td>

                            </tr>


                            <!-- Profile ID -->
                            <tr>

                                <th>
                                    Profile ID
                                </th>

                                <td th:text="${vendor.id}">
                                    -
                                </td>

                            </tr>


                            <!-- Full Name -->
                            <tr>

                                <th>
                                    Full Name
                                </th>

                                <td th:text="${vendor.fullName}">
                                    -
                                </td>

                            </tr>


                            <!-- Email -->
                            <tr>

                                <th>
                                    Email
                                </th>

                                <td th:text="${vendor.email}">
                                    -
                                </td>

                            </tr>


                            <!-- Phone Number -->
                            <tr>

                                <th>
                                    Phone Number
                                </th>

                                <td th:text="${vendor.phoneNumber}">
                                    -
                                </td>

                            </tr>


                            <!-- Email Verification -->
                            <tr>

                                <th>
                                    Email Verification
                                </th>

                                <td>


                                    <span class="badge bg-success"
                                          th:if="${vendor.emailVerified}">

                                        <i class="bi bi-check-circle me-1"></i>
                                        Verified

                                    </span>


                                    <span class="badge bg-danger"
                                          th:unless="${vendor.emailVerified}">

                                        <i class="bi bi-x-circle me-1"></i>
                                        Not Verified

                                    </span>

                                </td>

                            </tr>


                            <!-- Phone Verification -->
                            <tr>

                                <th>
                                    Phone Verification
                                </th>

                                <td>


                                    <span class="badge bg-success"
                                          th:if="${vendor.vendorAuth.verified}">

                                        <i class="bi bi-check-circle me-1"></i>
                                        Verified

                                    </span>


                                    <span class="badge bg-danger"
                                          th:unless="${vendor.vendorAuth.verified}">

                                        <i class="bi bi-x-circle me-1"></i>
                                        Not Verified

                                    </span>

                                </td>

                            </tr>


                            <!-- Account Status -->
                            <tr>

                                <th>
                                    Account Status
                                </th>

                                <td>


                                    <span class="badge bg-success"
                                          th:if="${vendor.active}">

                                        <i class="bi bi-check-circle me-1"></i>
                                        Active

                                    </span>


                                    <span class="badge bg-danger"
                                          th:unless="${vendor.active}">

                                        <i class="bi bi-x-circle me-1"></i>
                                        Inactive

                                    </span>

                                </td>

                            </tr>


                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <div th:replace="~{vendor/fragments/footer :: footer}"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
