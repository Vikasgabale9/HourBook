<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Vendor Profile</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="vendor/fragments/sidebar :: sidebar"></div>

<div style="margin-left:260px;">

    <div th:replace="vendor/fragments/header :: header"></div>

    <div class="container-fluid p-4">

        <!-- Page Title -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    <i class="bi bi-person-circle text-primary"></i>
                    Vendor Profile
                </h2>

                <p class="text-muted mb-0">
                    View your account information
                </p>

            </div>

            <a th:href="@{/vendor/profile/edit}"
               class="btn btn-primary">

                <i class="bi bi-pencil-square"></i>

                Edit Profile

            </a>

        </div>

        <div class="row">

            <!-- Profile Card -->

            <div class="col-lg-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <img th:if="${profile.profileImage != null}"
                             th:src="@{${profile.profileImage}}"
                             class="rounded-circle mb-3"
                             width="140"
                             height="140">

                        <img th:unless="${profile.profileImage != null}"
                             src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                             class="rounded-circle mb-3"
                             width="140"
                             height="140">

                        <h4 th:text="${profile.fullName}"></h4>

                        <p class="text-muted">
                            Vendor
                        </p>

                        <span class="badge bg-success"
                              th:if="${profile.active}">
                            Active
                        </span>

                        <span class="badge bg-danger"
                              th:unless="${profile.active}">
                            Inactive
                        </span>

                    </div>

                </div>

            </div>

            <!-- Details -->

            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-header bg-primary text-white">

                        Personal Information

                    </div>

                    <div class="card-body">

                        <table class="table table-bordered align-middle">

                            <tbody>

                            <tr>

                                <th width="30%">Vendor ID</th>

                                <td th:text="${profile.vendorId}"></td>

                            </tr>

                            <tr>

                                <th>Full Name</th>

                                <td th:text="${profile.fullName}"></td>

                            </tr>

                            <tr>

                                <th>Email</th>

                                <td th:text="${profile.email}"></td>

                            </tr>

                            <tr>

                                <th>Phone Number</th>

                                <td th:text="${profile.phoneNumber}"></td>

                            </tr>

                            <tr>

                                <th>Email Verification</th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${profile.emailVerified}">

                                        Verified

                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${profile.emailVerified}">

                                        Not Verified

                                    </span>

                                </td>

                            </tr>

                            <tr>

                                <th>Phone Verification</th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${profile.phoneVerified}">

                                        Verified

                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${profile.phoneVerified}">

                                        Not Verified

                                    </span>

                                </td>

                            </tr>

                            <tr>

                                <th>Account Status</th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${profile.active}">
                                        Active
                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${profile.active}">
                                        Inactive
                                    </span>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div th:replace="vendor/fragments/footer :: footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
