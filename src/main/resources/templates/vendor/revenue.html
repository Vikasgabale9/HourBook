<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Revenue</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{vendor/fragments/sidebar :: sidebar}"></div>

<div style="margin-left:260px;">

    <div th:replace="~{vendor/fragments/header :: header}"></div>

    <div class="container-fluid p-4">

        <h2 class="fw-bold mb-4">

            <i class="bi bi-cash-stack text-success"></i>

            Revenue Dashboard

        </h2>

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body text-center">

                        <h2>₹6,500</h2>

                        <p>Today's Revenue</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body text-center">

                        <h2>₹1,85,000</h2>

                        <p>Monthly Revenue</p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body text-center">

                        <h2>₹9,65,000</h2>

                        <p>Total Revenue</p>

                    </div>

                </div>

            </div>

        </div>

        <div class="card shadow-sm mt-4">

            <div class="card-header bg-success text-white">

                Revenue Summary

            </div>

            <div class="card-body">

                <table class="table table-bordered">

                    <thead>

                    <tr>

                        <th>Month</th>

                        <th>Bookings</th>

                        <th>Revenue</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr>

                        <td>May 2026</td>

                        <td>89</td>

                        <td>₹1,52,000</td>

                    </tr>

                    <tr>

                        <td>June 2026</td>

                        <td>97</td>

                        <td>₹1,78,500</td>

                    </tr>

                    <tr>

                        <td>July 2026</td>

                        <td>128</td>

                        <td>₹1,85,000</td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
