<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Vendor Dashboard</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="vendor/fragments/sidebar :: sidebar"></div>

<div style="margin-left:260px;">

    <div th:replace="vendor/fragments/header :: header"></div>

    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">

                    Welcome,
                    <span class="text-primary"
                          th:text="${dashboard.vendorName}"></span>

                </h2>

                <p class="text-muted mb-0">
                    Vendor Dashboard
                </p>

            </div>

        </div>

        <!-- Statistics -->

        <div class="row g-4">

            <div class="col-lg-3 col-md-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <i class="bi bi-shop display-5 text-primary"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.totalGrounds}"></h3>

                        <p class="text-muted mb-0">
                            Total Grounds
                        </p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <i class="bi bi-check-circle display-5 text-success"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.activeGrounds}"></h3>

                        <p class="text-muted mb-0">
                            Active Grounds
                        </p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <i class="bi bi-clock-history display-5 text-warning"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.pendingGrounds}"></h3>

                        <p class="text-muted mb-0">
                            Pending Grounds
                        </p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <i class="bi bi-calendar-check display-5 text-info"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.totalBookings}"></h3>

                        <p class="text-muted mb-0">
                            Total Bookings
                        </p>

                    </div>

                </div>

            </div>

        </div>

        <!-- Vendor Details -->

        <div class="card shadow-sm border-0 mt-4">

            <div class="card-header bg-primary text-white">

                Vendor Information

            </div>

            <div class="card-body">

                <table class="table table-bordered align-middle">

                    <tbody>

                    <tr>

                        <th width="30%">Vendor Name</th>

                        <td th:text="${dashboard.vendorName}"></td>

                    </tr>

                    <tr>

                        <th>Email</th>

                        <td th:text="${dashboard.vendorEmail}"></td>

                    </tr>

                    <tr>

                        <th>Phone Number</th>

                        <td th:text="${dashboard.phoneNumber}"></td>

                    </tr>

                    <tr>

                        <th>Email Verified</th>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${dashboard.emailVerified}">

                                Verified

                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${dashboard.emailVerified}">

                                Not Verified

                            </span>

                        </td>

                    </tr>

                    <tr>

                        <th>Phone Verified</th>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${dashboard.phoneVerified}">

                                Verified

                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${dashboard.phoneVerified}">

                                Not Verified

                            </span>

                        </td>

                    </tr>

					<tr>

					    <th>KYC Status</th>

					    <td>

					        <span class="badge bg-success"
					              th:if="${dashboard.kycStatus != null and dashboard.kycStatus.name() == 'VERIFIED'}">
					            Verified
					        </span>

					        <span class="badge bg-warning text-dark"
					              th:if="${dashboard.kycStatus != null and dashboard.kycStatus.name() == 'PENDING'}">
					            Pending
					        </span>

					        <span class="badge bg-danger"
					              th:if="${dashboard.kycStatus != null and dashboard.kycStatus.name() == 'REJECTED'}">
					            Rejected
					        </span>

					        <span class="badge bg-secondary"
					              th:if="${dashboard.kycStatus != null and dashboard.kycStatus.name() == 'NOT_SUBMITTED'}">
					            Not Submitted
					        </span>

					    </td>

					</tr>
                    <tr>

                        <th>Account Status</th>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${dashboard.vendorActive}">

                                Active

                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${dashboard.vendorActive}">

                                Inactive

                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div th:replace="vendor/fragments/footer :: footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
