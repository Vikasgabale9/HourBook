<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Vendor</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">


<!-- ========================= -->
<!-- SIDEBAR -->
<!-- ========================= -->

<div th:replace="~{vendor/fragments/sidebar :: sidebar}"></div>


<!-- ========================= -->
<!-- MAIN CONTENT -->
<!-- ========================= -->

<div class="container-fluid">

    <!-- HEADER -->

    <div th:replace="~{vendor/fragments/header :: header}"></div>


    <!-- CONTENT -->

    <div class="container py-4">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- PAGE TITLE -->

                <div class="mb-4">

                    <h3 class="fw-bold">
                        Edit Profile
                    </h3>

                    <p class="text-muted mb-0">
                        Update your vendor profile information
                    </p>

                </div>


                <!-- SUCCESS MESSAGE -->

                <div
                        th:if="${success}"
                        class="alert alert-success alert-dismissible fade show">

                    <i class="bi bi-check-circle me-2"></i>

                    <span th:text="${success}">
                        Profile updated successfully
                    </span>

                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>


                <!-- ERROR MESSAGE -->

                <div
                        th:if="${error}"
                        class="alert alert-danger alert-dismissible fade show">

                    <i class="bi bi-exclamation-circle me-2"></i>

                    <span th:text="${error}">
                        Something went wrong
                    </span>

                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>


                <!-- CARD -->

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">


                        <!-- PROFILE IMAGE -->

                        <div class="text-center mb-4">

                            <div class="position-relative d-inline-block">

                                <!-- Existing image -->

                                <img
                                        id="profilePreview"

                                        th:if="${vendor.profileImage != null
                                                and !vendor.profileImage.isEmpty()}"

                                        th:src="@{${vendor.profileImage}}"

                                        class="rounded-circle border shadow"

                                        width="150"
                                        height="150"

                                        style="object-fit: cover;">

                                <!-- Default image -->

                                <img
                                        id="profilePreview"

                                        th:unless="${vendor.profileImage != null
                                                   and !vendor.profileImage.isEmpty()}"

                                        src="https://placehold.co/150x150"

                                        class="rounded-circle border shadow"

                                        width="150"
                                        height="150"

                                        style="object-fit: cover;">

                            </div>

                            <div class="mt-3">

                                <label
                                        for="profileImage"
                                        class="btn btn-outline-primary">

                                    <i class="bi bi-camera me-1"></i>

                                    Change Photo

                                </label>

                                <input
                                        type="file"
                                        id="profileImage"
                                        name="profileImage"
                                        accept="image/jpeg,image/jpg,image/png"
                                        class="d-none"
                                        form="profileForm">

                                <p class="text-muted small mt-2 mb-0">
                                    JPG, JPEG or PNG
                                </p>

                                <p class="text-muted small">
                                    Maximum size: 2 MB
                                </p>

                            </div>

                        </div>


                        <!-- FORM -->

                        <form
                                id="profileForm"

                                th:action="@{/vendor/profile/update}"

                                method="post"

                                enctype="multipart/form-data">


                            <!-- FULL NAME -->

                            <div class="mb-3">

                                <label
                                        for="fullName"
                                        class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input
                                        type="text"

                                        id="fullName"

                                        name="fullName"

                                        class="form-control"

                                        th:value="${vendor.fullName}"

                                        placeholder="Enter full name"

                                        required>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                        for="email"
                                        class="form-label fw-semibold">

                                    Email

                                </label>

                                <input
                                        type="email"

                                        id="email"

                                        name="email"

                                        class="form-control"

                                        th:value="${vendor.email}"

                                        placeholder="Enter email"

                                        required>

                            </div>


                            <!-- PHONE -->

                            <div class="mb-3">

                                <label
                                        class="form-label fw-semibold">

                                    Phone Number

                                </label>

                                <input
                                        type="text"

                                        class="form-control"

                                        th:value="${vendor.phoneNumber}"

                                        readonly>

                                <div class="form-text">

                                    Phone number cannot be changed here.

                                </div>

                            </div>


                            <!-- KYC STATUS -->

                            <div class="mb-4">

                                <label
                                        class="form-label fw-semibold">

                                    KYC Status

                                </label>

                                <div>

                                    <span
                                            class="badge bg-success"
                                            th:if="${vendor.kycStatus != null}"
                                            th:text="${vendor.kycStatus}">

                                        APPROVED

                                    </span>

                                    <span
                                            class="text-muted"
                                            th:unless="${vendor.kycStatus != null}">

                                        Not available

                                    </span>

                                </div>

                            </div>


                            <!-- BUTTONS -->

                            <div class="d-flex gap-2">

                                <button
                                        type="submit"
                                        class="btn btn-primary">

                                    <i class="bi bi-check-lg me-1"></i>

                                    Save Changes

                                </button>


                                <a
                                        th:href="@{/vendor/profile}"
                                        class="btn btn-outline-secondary">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- IMAGE PREVIEW -->
<!-- ========================= -->

<script>

    const profileImage =
        document.getElementById("profileImage");

    const profilePreview =
        document.getElementById("profilePreview");


    profileImage.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }


        // Validate size

		if (file.size > 5 * 1024 * 1024) {

		    alert("Profile image must not exceed 5 MB.");

		    this.value = "";

		    return;
		}


        // Validate type

        const allowedTypes = [
            "image/jpeg",
            "image/jpg",
            "image/png"
        ];

        if (!allowedTypes.includes(file.type)) {

            alert(
                "Only JPG, JPEG and PNG images are allowed."
            );

            this.value = "";

            return;
        }


        // Preview

        const reader = new FileReader();

        reader.onload = function (event) {

            profilePreview.src =
                event.target.result;

        };

        reader.readAsDataURL(file);

    });

</script>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
