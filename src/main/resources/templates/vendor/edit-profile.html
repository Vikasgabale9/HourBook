
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Vendor | HourBook</title>

    <!-- HourBook Browser Tab Logo -->
    <link rel="icon"
          type="image/svg+xml"
          th:href="@{/images/logo.svg}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Vendor CSS -->
    <link rel="stylesheet"
          th:href="@{/css/vendor.css}">

    <style>
        .profile-card {
            border-radius: 16px;
        }

        .profile-image-wrapper {
            width: 150px;
            height: 150px;
            margin: auto;
            position: relative;
        }

        .profile-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
        }

        .profile-upload-label {
            cursor: pointer;
        }

        .form-control {
            border-radius: 8px;
            padding: 11px 13px;
        }

        .profile-upload-label:hover {
            background-color: #0d6efd;
            color: #ffffff;
        }

        .profile-help {
            font-size: 12px;
        }
    </style>

</head>

<body class="bg-light">

<!-- ================= SIDEBAR ================= -->

<div th:replace="~{vendor/fragments/sidebar :: sidebar}"></div>


<!-- ================= MAIN CONTENT ================= -->

<div class="container-fluid">

    <!-- HEADER -->
    <div th:replace="~{vendor/fragments/header :: header}"></div>


    <div class="container py-4">

        <div class="row justify-content-center">

            <div class="col-lg-8 col-xl-7">

                <!-- PAGE TITLE -->

                <div class="mb-4">

                    <h3 class="fw-bold">
                        <i class="bi bi-person-gear me-2"></i>
                        Edit Profile
                    </h3>

                    <p class="text-muted mb-0">
                        Update your vendor profile information.
                    </p>

                </div>


                <!-- SUCCESS MESSAGE -->

                <div th:if="${success}"
                     class="alert alert-success alert-dismissible fade show"
                     role="alert">

                    <i class="bi bi-check-circle me-2"></i>

                    <span th:text="${success}">
                        Profile updated successfully.
                    </span>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close">
                    </button>

                </div>


                <!-- ERROR MESSAGE -->

                <div th:if="${error}"
                     class="alert alert-danger alert-dismissible fade show"
                     role="alert">

                    <i class="bi bi-exclamation-circle me-2"></i>

                    <span th:text="${error}">
                        Something went wrong.
                    </span>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close">
                    </button>

                </div>


                <!-- PROFILE CARD -->

                <div class="card border-0 shadow-sm profile-card">

                    <div class="card-body p-4 p-md-5">

                        <!-- PROFILE IMAGE -->

                        <div class="text-center mb-4">

                            <div class="profile-image-wrapper">

                                <img id="profilePreview"
                                     th:src="${vendor.profileImage != null
                                              and !#strings.isEmpty(vendor.profileImage)
                                              ? vendor.profileImage
                                              : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"
                                     alt="Vendor Profile Image"
                                     class="profile-preview">

                            </div>


                            <div class="mt-3">

                                <label for="profileImage"
                                       class="btn btn-outline-primary profile-upload-label">

                                    <i class="bi bi-camera me-2"></i>
                                    Change Profile Photo

                                </label>

                                <input type="file"
                                       id="profileImage"
                                       name="profileImage"
                                       accept="image/jpeg,image/png,image/webp"
                                       class="d-none"
                                       form="profileForm">

                                <p class="text-muted small mt-2 mb-0">
                                    Supported formats: JPG, PNG, WEBP
                                </p>

                                <p class="text-muted small profile-help mb-0">
                                    Maximum file size: 5 MB
                                </p>

                            </div>

                        </div>


                        <hr class="my-4">


                        <!-- EDIT PROFILE FORM -->

                        <form id="profileForm"
                              th:action="@{/vendor/profile/update}"
                              method="post"
                              enctype="multipart/form-data">


                            <!-- FULL NAME -->

                            <div class="mb-3">

                                <label for="fullName"
                                       class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input type="text"
                                       id="fullName"
                                       name="fullName"
                                       class="form-control"
                                       th:value="${vendor.fullName}"
                                       placeholder="Enter your full name"
                                       maxlength="100"
                                       required>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label for="email"
                                       class="form-label fw-semibold">

                                    Email Address

                                </label>

                                <input type="email"
                                       id="email"
                                       name="email"
                                       class="form-control"
                                       th:value="${vendor.email}"
                                       placeholder="Enter your email"
                                       maxlength="150"
                                       required>

                            </div>


                            <!-- PHONE NUMBER -->

                            <div class="mb-3">

                                <label for="phoneNumber"
                                       class="form-label fw-semibold">

                                    Phone Number

                                </label>

                                <input type="text"
                                       id="phoneNumber"
                                       class="form-control"
                                       th:value="${vendor.phoneNumber}"
                                       readonly>

                                <div class="form-text">
                                    Phone number cannot be changed here.
                                </div>

                            </div>


                            <!-- KYC STATUS -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    KYC Status

                                </label>

                                <div>

                                    <span th:if="${vendor.kycStatus != null}"
                                          class="badge bg-success"
                                          th:text="${vendor.kycStatus}">
                                        APPROVED
                                    </span>

                                    <span th:unless="${vendor.kycStatus != null}"
                                          class="badge bg-secondary">
                                        Not Submitted
                                    </span>

                                </div>

                            </div>


                            <!-- ACTION BUTTONS -->

                            <div class="d-flex flex-wrap gap-2">

                                <button type="submit"
                                        id="saveButton"
                                        class="btn btn-primary">

                                    <i class="bi bi-check-lg me-1"></i>

                                    Save Changes

                                </button>

                                <a th:href="@{/vendor/profile}"
                                   class="btn btn-outline-secondary">

                                    <i class="bi bi-arrow-left me-1"></i>

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================= IMAGE PREVIEW ================= -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const profileImage =
            document.getElementById("profileImage");

        const profilePreview =
            document.getElementById("profilePreview");

        const profileForm =
            document.getElementById("profileForm");

        const saveButton =
            document.getElementById("saveButton");

        const MAX_SIZE = 5 * 1024 * 1024;

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        let previewUrl = null;

        profileImage.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) {
                return;
            }

            // Validate image size.

            if (file.size > MAX_SIZE) {

                alert("Profile image must not exceed 5 MB.");

                this.value = "";

                return;
            }

            // Validate image type.

            if (!allowedTypes.includes(file.type)) {

                alert("Only JPG, PNG and WEBP images are allowed.");

                this.value = "";

                return;
            }

            // Remove previous preview URL.

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }

            // Preview selected image.

            previewUrl = URL.createObjectURL(file);

            profilePreview.src = previewUrl;

        });


        // Prevent accidental double submission.

        profileForm.addEventListener("submit", function () {

            saveButton.disabled = true;

            saveButton.innerHTML =
                '<span class="spinner-border spinner-border-sm me-2"></span>' +
                'Saving...';

        });

        window.addEventListener("beforeunload", function () {

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }

        });

    });

</script>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
