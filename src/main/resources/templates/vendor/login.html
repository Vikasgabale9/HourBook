<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vendor Login - HourBook</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                    135deg,
                    #f5f7fa 0%,
                    #e9eef5 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0d6efd;
            color: white;

            font-size: 30px;
        }

        .brand h2 {
            margin: 0;
            font-weight: 700;
            color: #212529;
        }

        .brand p {
            margin-top: 7px;
            color: #6c757d;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #ced4da;
            padding-left: 15px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;

            top: 50%;
            right: 15px;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #6c757d;

            cursor: pointer;

            font-size: 18px;
        }

        .password-toggle:hover {
            color: #0d6efd;
        }

        .login-btn {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 10px;

            background: #0d6efd;
            color: white;

            font-weight: 600;
            font-size: 16px;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #0b5ed7;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .register-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link a:hover {
            color: #0d6efd;
        }

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }

        .input-icon {
            margin-right: 6px;
        }

        @media (max-width: 576px) {

            .login-wrapper {
                padding: 15px;
            }

            .login-card {
                padding: 25px 20px;
            }
        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Brand -->
        <div class="brand">

            <div class="brand-icon">
                <i class="bi bi-shop"></i>
            </div>

            <h2>HourBook</h2>

            <p>
                Vendor Panel Login
            </p>

        </div>


        <!-- Registration Success -->
        <div
                th:if="${param.registered}"
                class="alert alert-success"
                role="alert">

            <i class="bi bi-check-circle-fill me-2"></i>

            Vendor registration successful.
            Please login with your password.

        </div>


        <!-- Login Error -->
        <div
                th:if="${error}"
                class="alert alert-danger"
                role="alert">

            <i class="bi bi-exclamation-triangle-fill me-2"></i>

            <span th:text="${error}">
                Invalid login credentials
            </span>

        </div>


        <!-- Login Form -->
        <form
                th:action="@{/vendor/login}"
                method="post">


            <!-- Login ID -->
            <div class="mb-3">

                <label
                        for="loginId"
                        class="form-label">

                    <i class="bi bi-person-circle input-icon"></i>

                    Phone Number or Email

                </label>

                <input
                        type="text"
                        id="loginId"
                        name="loginId"
                        class="form-control"
                        placeholder="Enter phone number or email"
                        autocomplete="username"
                        required>

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label
                        for="password"
                        class="form-label">

                    <i class="bi bi-lock-fill input-icon"></i>

                    Password

                </label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- Login Button -->
            <button
                    type="submit"
                    class="login-btn">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login

            </button>

        </form>


        <!-- Register -->
        <div class="register-link">

            Don't have a vendor account?

            <a th:href="@{/vendor/register}">
                Register as Vendor
            </a>

        </div>


        <!-- Home -->
        <div class="home-link">

            <a th:href="@{/}">

                <i class="bi bi-house-door me-1"></i>

                Back to Home

            </a>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Password Toggle -->
<script>

    const togglePassword =
        document.getElementById("togglePassword");

    const password =
        document.getElementById("password");


    togglePassword.addEventListener("click", function () {

        const type =
            password.getAttribute("type") === "password"
                ? "text"
                : "password";

        password.setAttribute("type", type);


        const icon =
            this.querySelector("i");


        if (type === "text") {

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

            this.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

            this.setAttribute(
                "aria-label",
                "Show password"
            );
        }

    });

</script>

</body>

</html>
