<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>View Ground</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="vendor/fragments/sidebar :: sidebar"></div>

<div style="margin-left:260px;">

    <div th:replace="vendor/fragments/header :: header"></div>

    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between mb-4">

            <h2>

                <i class="bi bi-building"></i>

                Ground Details

            </h2>

            <a th:href="@{/vendor/grounds}"
               class="btn btn-secondary">

                Back

            </a>

        </div>

        <div class="card shadow">

            <div class="card-body">

                <table class="table table-bordered">

                    <tr>
                        <th width="25%">Ground Name</th>
                        <td th:text="${ground.name}"></td>
                    </tr>

                    <tr>
                        <th>Location</th>
                        <td th:text="${ground.location}"></td>
                    </tr>

                    <tr>
                        <th>Sport</th>
                        <td th:text="${ground.sports}"></td>
                    </tr>

                    <tr>
                        <th>Ground Type</th>
                        <td th:text="${ground.type}"></td>
                    </tr>

                    <tr>
                        <th>Price Per Hour</th>
                        <td>

                            ₹
                            <span th:text="${ground.pricePerHour}"></span>

                        </td>
                    </tr>

                    <tr>

                        <th>Status</th>

                        <td>

                            <span class="badge bg-warning"
                                  th:if="${ground.status.name()=='PENDING'}">

                                Pending

                            </span>

                            <span class="badge bg-success"
                                  th:if="${ground.status.name()=='APPROVED'}">

                                Approved

                            </span>

                            <span class="badge bg-danger"
                                  th:if="${ground.status.name()=='REJECTED'}">

                                Rejected

                            </span>

                        </td>

                    </tr>

                    <tr>

                        <th>Availability</th>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${ground.isActive}">

                                Active

                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${ground.isActive}">

                                Inactive

                            </span>

                        </td>

                    </tr>

                    <tr>

                        <th>Amenities</th>

                        <td>

                            <span class="badge bg-primary me-2 mb-2"
                                  th:each="amenity : ${ground.amenities}"
                                  th:text="${amenity}">

                            </span>

                        </td>

                    </tr>

                    <tr>

                        <th>Ground Images</th>

                        <td>

                            <img
                                    th:each="img : ${ground.imageUrls}"

                                    th:src="@{${img}}"

                                    width="180"

                                    class="rounded border me-3 mb-3">

                        </td>

                    </tr>

                </table>

            </div>

        </div>

    </div>

    <div th:replace="vendor/fragments/footer :: footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
