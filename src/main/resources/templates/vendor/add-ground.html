<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Ground | HourBook</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{vendor/fragments/sidebar :: sidebar}"></div>

<div style="margin-left:260px;">

    <div th:replace="~{vendor/fragments/header :: header}"></div>

    <div class="container-fluid p-4">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">

                    <i class="bi bi-plus-circle"></i>

                    Add Ground

                </h3>

            </div>

            <div class="card-body">

                <form
                        th:action="@{/vendor/grounds/add}"
                        th:object="${ground}"
                        method="post"
                        enctype="multipart/form-data">

                    <!-- Ground Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Ground Name
                        </label>

                        <input
                                type="text"
                                th:field="*{name}"
                                class="form-control">

                        <small
                                class="text-danger"
                                th:errors="*{name}">
                        </small>

                    </div>


                    <!-- Sports -->

                    <div class="mb-3">

                        <label class="form-label">
                            Sports
                        </label>

                        <input
                                type="text"
                                th:field="*{sports}"
                                class="form-control"
                                placeholder="Cricket, Football...">

                        <small
                                class="text-danger"
                                th:errors="*{sports}">
                        </small>

                    </div>


                    <!-- Location -->

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                                type="text"
                                th:field="*{location}"
                                class="form-control">

                        <small
                                class="text-danger"
                                th:errors="*{location}">
                        </small>

                    </div>


                    <!-- Price -->

                    <div class="mb-3">

                        <label class="form-label">
                            Price Per Hour
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                ₹
                            </span>

                            <input
                                    type="number"
                                    step="0.01"
                                    min="1"
                                    th:field="*{pricePerHour}"
                                    class="form-control">

                        </div>

                        <small
                                class="text-danger"
                                th:errors="*{pricePerHour}">
                        </small>

                    </div>


                    <!-- Operating Hours -->

                    <div class="card border mb-4">

                        <div class="card-header bg-light">

                            <strong>
                                <i class="bi bi-clock"></i>
                                Ground Operating Hours
                            </strong>

                        </div>

                        <div class="card-body">

                            <div class="row">

                                <!-- Opening Time -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Opening Time
                                    </label>

                                    <input
                                            type="time"
                                            th:field="*{openingTime}"
                                            class="form-control">

                                    <small
                                            class="text-danger"
                                            th:errors="*{openingTime}">
                                    </small>

                                </div>


                                <!-- Closing Time -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Closing Time
                                    </label>

                                    <input
                                            type="time"
                                            th:field="*{closingTime}"
                                            class="form-control">

                                    <small
                                            class="text-danger"
                                            th:errors="*{closingTime}">
                                    </small>

                                </div>

                            </div>


                            <!-- Slot Duration -->

                            <div class="mb-2">

                                <label class="form-label">
                                    Booking Slot Duration
                                </label>

                                <div class="input-group">

                                    <input
                                            type="number"
                                            th:field="*{slotDurationMinutes}"
                                            value="60"
                                            readonly
                                            class="form-control">

                                    <span class="input-group-text">
                                        Minutes
                                    </span>

                                </div>

                                <small class="text-muted">

                                    Currently HourBook uses fixed
                                    60-minute booking slots.

                                </small>

                            </div>

                        </div>

                    </div>


                    <!-- Ground Type -->

                    <div class="mb-3">

                        <label class="form-label">
                            Ground Type
                        </label>

                        <select
                                th:field="*{type}"
                                class="form-select">

                            <option value="">
                                Select Type
                            </option>

                            <option
                                    th:each="type : ${T(com.app.hourbook.enums.GroundType).values()}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>

                        </select>

                        <small
                                class="text-danger"
                                th:errors="*{type}">
                        </small>

                    </div>


                    <!-- Amenities -->

                    <div class="mb-3">

                        <label class="form-label">
                            Amenities
                        </label>

                        <div class="row">

                            <div
                                    class="col-md-4"
                                    th:each="amenity : ${T(com.app.hourbook.enums.Amenities).values()}">

                                <div class="form-check">

                                    <input
                                            class="form-check-input"
                                            type="checkbox"
                                            th:field="*{amenities}"
                                            th:value="${amenity}">

                                    <label
                                            class="form-check-label"
                                            th:text="${amenity}">
                                    </label>

                                </div>

                            </div>

                        </div>

                        <small
                                class="text-danger"
                                th:errors="*{amenities}">
                        </small>

                    </div>


                    <!-- Images -->

                    <div class="mb-4">

                        <label class="form-label">
                            Upload Images
                        </label>

                        <input
                                type="file"
                                multiple
                                accept="image/*"
                                th:field="*{images}"
                                class="form-control">

                    </div>


                    <!-- Buttons -->

                    <button
                            type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Save Ground

                    </button>

                    <a
                            th:href="@{/vendor/grounds}"
                            class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

    <div th:replace="~{vendor/fragments/footer :: footer}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
