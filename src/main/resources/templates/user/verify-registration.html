<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Verify Registration | HourBook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>


<body class="hb-body">


<main class="hb-auth">

    <div class="hb-auth__card">


        <div class="hb-auth__head">

            <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>


            <h1 class="hb-auth__brand">

                Verify Registration

            </h1>


            <p class="hb-auth__sub">

                Email verification

            </p>

        </div>


        <div class="hb-auth__body">


            <!-- Error -->

            <div th:if="${error}"
                 class="alert alert-danger"
                 role="alert">

                <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>

                <span th:text="${error}"></span>

            </div>


            <div class="text-center mb-4">

                <p class="text-muted mb-1">

                    OTP has been sent to

                </p>


                <strong th:text="${email}">

                    example@email.com

                </strong>

            </div>


            <form th:action="@{/user/verify-registration}"
                  th:object="${otpRequest}"
                  method="post">


                <div class="mb-4">

                    <label class="form-label" for="otp">

                        Enter OTP

                    </label>


                    <input type="text"
                           th:field="*{otp}"
                           class="form-control hb-otp"
                           maxlength="6"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           placeholder="------">


                    <div class="hb-field-error"
                         th:if="${#fields.hasErrors('otp')}"
                         th:errors="*{otp}">
                    </div>

                </div>


                <button type="submit"
                        class="btn btn-primary btn-lg w-100">

                    <i class="bi bi-check-circle" aria-hidden="true"></i>

                    Verify &amp; Register

                </button>


            </form>


            <hr>


            <div class="text-center">

                <a th:href="@{/user/register}"
                   class="text-decoration-none">

                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>

                    Back to Registration

                </a>

            </div>


        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
