<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Verify Registration | HourBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">


    <style>

        body {

            background: #f5f7fb;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .otp-card {

            width: 430px;

            border: none;

            border-radius: 16px;

            box-shadow: 0 10px 35px rgba(0,0,0,.12);

        }


        .otp-header {

            background: #2563eb;

            color: white;

            text-align: center;

            padding: 30px;

            border-radius: 16px 16px 0 0;

        }


        .otp-icon {

            font-size: 45px;

        }


        .otp-input {

            height: 55px;

            text-align: center;

            font-size: 24px;

            letter-spacing: 8px;

            font-weight: bold;

        }


        .btn-verify {

            height: 48px;

            border-radius: 10px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="card otp-card">


    <div class="otp-header">

        <div class="otp-icon">

            <i class="bi bi-shield-lock-fill"></i>

        </div>


        <h3 class="fw-bold">

            Verify Registration

        </h3>


        <p class="mb-0">

            Email verification

        </p>

    </div>


    <div class="card-body p-4">


        <!-- Error -->

        <div th:if="${error}"
             class="alert alert-danger">

            <i class="bi bi-exclamation-circle me-2"></i>

            <span th:text="${error}"></span>

        </div>


        <div class="text-center mb-4">

            <p class="text-muted mb-1">

                OTP has been sent to

            </p>


            <strong th:text="${email}">

                example@email.com

            </strong>

        </div>


        <form th:action="@{/user/verify-registration}"
              th:object="${otpRequest}"
              method="post">


            <div class="mb-4">

                <label class="form-label">

                    Enter OTP

                </label>


                <input type="text"
                       th:field="*{otp}"
                       class="form-control otp-input"
                       maxlength="6"
                       inputmode="numeric"
                       autocomplete="one-time-code"
                       placeholder="------">


                <div class="text-danger small mt-1"
                     th:if="${#fields.hasErrors('otp')}"
                     th:errors="*{otp}">
                </div>

            </div>


            <button type="submit"
                    class="btn btn-primary btn-verify w-100">

                <i class="bi bi-check-circle me-2"></i>

                Verify & Register

            </button>


        </form>


        <hr>


        <div class="text-center">

            <a th:href="@{/user/register}"
               class="text-decoration-none">

                <i class="bi bi-arrow-left me-1"></i>

                Back to Registration

            </a>

        </div>


    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
