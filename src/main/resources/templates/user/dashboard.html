<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>User Dashboard</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="user/fragments/sidebar :: sidebar"></div>

<div style="margin-left:260px;">

    <div th:replace="user/fragments/header :: header"></div>

    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">

                    Welcome,

                    <span class="text-primary"
                          th:text="${dashboard.fullName}">
                    </span>

                </h2>

                <p class="text-muted">

                    User Dashboard

                </p>

            </div>

        </div>

        <!-- Statistics -->

        <div class="row g-4">

            <div class="col-lg-3">

                <div class="card shadow-sm">

                    <div class="card-body text-center">

                        <i class="bi bi-calendar-check display-5 text-primary"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.totalBookings}">
                        </h3>

                        <p>Total Bookings</p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card shadow-sm">

                    <div class="card-body text-center">

                        <i class="bi bi-clock-history display-5 text-warning"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.upcomingBookings}">
                        </h3>

                        <p>Upcoming</p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card shadow-sm">

                    <div class="card-body text-center">

                        <i class="bi bi-check-circle display-5 text-success"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.completedBookings}">
                        </h3>

                        <p>Completed</p>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card shadow-sm">

                    <div class="card-body text-center">

                        <i class="bi bi-x-circle display-5 text-danger"></i>

                        <h3 class="mt-3"
                            th:text="${dashboard.cancelledBookings}">
                        </h3>

                        <p>Cancelled</p>

                    </div>

                </div>

            </div>

        </div>

        <!-- Profile -->

        <div class="card shadow-sm mt-4">

            <div class="card-header bg-primary text-white">

                User Information

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 text-center">

                        <img th:src="@{${dashboard.profileImage}}"
                             class="img-thumbnail rounded-circle"
                             width="170"
                             height="170">

                    </div>

                    <div class="col-md-9">

                        <table class="table table-bordered">

                            <tr>

                                <th>Name</th>

                                <td th:text="${dashboard.fullName}"></td>

                            </tr>

                            <tr>

                                <th>Email</th>

                                <td th:text="${dashboard.email}"></td>

                            </tr>

                            <tr>

                                <th>Phone</th>

                                <td th:text="${dashboard.phoneNumber}"></td>

                            </tr>

                            <tr>

                                <th>Email Verification</th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${dashboard.emailVerified}">
                                        Verified
                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${dashboard.emailVerified}">
                                        Not Verified
                                    </span>

                                </td>

                            </tr>

                            <tr>

                                <th>Phone Verification</th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${dashboard.phoneVerified}">
                                        Verified
                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${dashboard.phoneVerified}">
                                        Not Verified
                                    </span>

                                </td>

                            </tr>

                            <tr>

                                <th>Account Status</th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${dashboard.active}">
                                        Active
                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${dashboard.active}">
                                        Inactive
                                    </span>

                                </td>

                            </tr>

                        </table>

                    </div>

                </div>

            </div>

        </div>

        <!-- Quick Actions -->

        <div class="card shadow-sm mt-4">

            <div class="card-header bg-dark text-white">

                Quick Actions

            </div>

            <div class="card-body">

                <a href="/user/grounds"
                   class="btn btn-primary">

                    Browse Grounds

                </a>

                <a href="/user/bookings"
                   class="btn btn-success">

                    My Bookings

                </a>

                <a href="/user/profile"
                   class="btn btn-warning">

                    Profile

                </a>

            </div>

        </div>

    </div>

    <div th:replace="user/fragments/footer :: footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
