<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>User Dashboard</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">

<div th:replace="user/fragments/sidebar :: sidebar"></div>

<div class="hb-main">

    <div th:replace="user/fragments/header :: header"></div>

    <main id="main-content" class="hb-content">

        <div class="hb-page-head">

            <div>

                <h1 class="hb-title">

                    Welcome,

                    <span class="text-primary"
                          th:text="${dashboard.fullName}">
                    </span>

                </h1>

                <p class="hb-subtitle">

                    User Dashboard

                </p>

            </div>

            <a th:href="@{/user/grounds}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle" aria-hidden="true"></i>

                Book a Ground

            </a>

        </div>

        <!-- Statistics -->

        <section aria-label="Booking statistics"
                 class="hb-stat-grid">

            <div class="card hb-stat">

                <span class="hb-stat__icon">
                    <i class="bi bi-calendar-check" aria-hidden="true"></i>
                </span>

                <div>

                    <p class="hb-stat__value"
                       th:text="${dashboard.totalBookings}">
                    </p>

                    <p class="hb-stat__label">Total Bookings</p>

                </div>

            </div>

            <div class="card hb-stat">

                <span class="hb-stat__icon">
                    <i class="bi bi-clock-history" aria-hidden="true"></i>
                </span>

                <div>

                    <p class="hb-stat__value"
                       th:text="${dashboard.upcomingBookings}">
                    </p>

                    <p class="hb-stat__label">Upcoming</p>

                </div>

            </div>

            <div class="card hb-stat">

                <span class="hb-stat__icon">
                    <i class="bi bi-check-circle" aria-hidden="true"></i>
                </span>

                <div>

                    <p class="hb-stat__value"
                       th:text="${dashboard.completedBookings}">
                    </p>

                    <p class="hb-stat__label">Completed</p>

                </div>

            </div>

            <div class="card hb-stat">

                <span class="hb-stat__icon">
                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                </span>

                <div>

                    <p class="hb-stat__value"
                       th:text="${dashboard.cancelledBookings}">
                    </p>

                    <p class="hb-stat__label">Cancelled</p>

                </div>

            </div>

        </section>

        <!-- Profile -->

        <section class="card mt-4">

            <div class="card-header">

                <h2 class="h5 mb-0">

                    <i class="bi bi-person-circle text-primary" aria-hidden="true"></i>

                    User Information

                </h2>

            </div>

            <div class="card-body">

                <div class="row g-4 align-items-start">

                    <div class="col-md-4 col-lg-3 text-center">

                        <img th:src="@{${dashboard.profileImage}}"
                             class="hb-profile-avatar"
                             width="170"
                             height="170"
                             alt="Your profile photo">

                    </div>

                    <div class="col-md-8 col-lg-9">

                        <dl class="hb-dl">

                            <div class="hb-dl__row">

                                <dt>Name</dt>

                                <dd th:text="${dashboard.fullName}"></dd>

                            </div>

                            <div class="hb-dl__row">

                                <dt>Email</dt>

                                <dd th:text="${dashboard.email}"></dd>

                            </div>

                            <div class="hb-dl__row">

                                <dt>Phone</dt>

                                <dd th:text="${dashboard.phoneNumber}"></dd>

                            </div>

                            <div class="hb-dl__row">

                                <dt>Email Verification</dt>

                                <dd>

                                    <span class="hb-badge hb-badge--success"
                                          th:if="${dashboard.emailVerified}">
                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                                        Verified
                                    </span>

                                    <span class="hb-badge hb-badge--danger"
                                          th:unless="${dashboard.emailVerified}">
                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
                                        Not Verified
                                    </span>

                                </dd>

                            </div>

                            <div class="hb-dl__row">

                                <dt>Phone Verification</dt>

                                <dd>

                                    <span class="hb-badge hb-badge--success"
                                          th:if="${dashboard.phoneVerified}">
                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                                        Verified
                                    </span>

                                    <span class="hb-badge hb-badge--danger"
                                          th:unless="${dashboard.phoneVerified}">
                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
                                        Not Verified
                                    </span>

                                </dd>

                            </div>

                            <div class="hb-dl__row">

                                <dt>Account Status</dt>

                                <dd>

                                    <span class="hb-badge hb-badge--success"
                                          th:if="${dashboard.active}">
                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                                        Active
                                    </span>

                                    <span class="hb-badge hb-badge--danger"
                                          th:unless="${dashboard.active}">
                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
                                        Inactive
                                    </span>

                                </dd>

                            </div>

                        </dl>

                    </div>

                </div>

            </div>

        </section>

        <!-- Quick Actions -->

        <section class="card mt-4">

            <div class="card-header">

                <h2 class="h5 mb-0">

                    Quick Actions

                </h2>

            </div>

            <div class="card-body">

                <div class="hb-booking-actions">

                    <a th:href="@{/user/grounds}"
                       class="btn btn-primary">

                        <i class="bi bi-building" aria-hidden="true"></i>

                        Browse Grounds

                    </a>

                    <a th:href="@{/user/bookings}"
                       class="btn btn-outline-primary">

                        <i class="bi bi-calendar-check" aria-hidden="true"></i>

                        My Bookings

                    </a>

                    <a th:href="@{/user/profile}"
                       class="btn btn-outline-secondary">

                        <i class="bi bi-person-circle" aria-hidden="true"></i>

                        Profile

                    </a>

                </div>

            </div>

        </section>

    </main>

    <div th:replace="user/fragments/footer :: footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
