<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Profile</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>

<div style="margin-left:260px;">

    <div th:replace="~{user/fragments/header :: header}"></div>

    <div class="container-fluid p-4">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-header bg-primary text-white
                                d-flex justify-content-between
                                align-items-center">

                        <h4 class="mb-0">

                            <i class="bi bi-person-circle"></i>

                            My Profile

                        </h4>

                        <a th:href="@{/user/profile/edit}"
                           class="btn btn-light btn-sm">

                            <i class="bi bi-pencil-square"></i>

                            Edit Profile

                        </a>

                    </div>


                    <div class="card-body">

                        <!-- Profile Image -->

                        <div class="text-center mb-4">

                            <!-- Uploaded Profile Image -->

                            <img th:if="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 th:src="@{${user.profileImage}}"
                                 class="rounded-circle border shadow"
                                 width="150"
                                 height="150"
                                 style="object-fit: cover;"
                                 alt="Profile Image">


                            <!-- Default Image -->

                            <img th:unless="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 src="https://placehold.co/150x150"
                                 class="rounded-circle border shadow"
                                 width="150"
                                 height="150"
                                 style="object-fit: cover;"
                                 alt="Default Profile Image">


                            <h3 class="mt-3 fw-bold"
                                th:text="${user.fullName}">
                            </h3>

                            <p class="text-muted">

                                HourBook User

                            </p>

                        </div>


                        <!-- Profile Details -->

                        <table class="table table-bordered align-middle">

                            <tbody>

                            <tr>

                                <th width="35%">
                                    User ID
                                </th>

                                <td th:text="${user.id}">
                                </td>

                            </tr>


                            <tr>

                                <th>
                                    Full Name
                                </th>

                                <td th:text="${user.fullName}">
                                </td>

                            </tr>


                            <tr>

                                <th>
                                    Email
                                </th>

                                <td th:text="${user.email}">
                                </td>

                            </tr>


                            <tr>

                                <th>
                                    Phone Number
                                </th>

                                <td th:text="${user.phoneNumber}">
                                </td>

                            </tr>


                            <tr>

                                <th>
                                    Email Verification
                                </th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${user.emailVerified}">

                                        Verified

                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${user.emailVerified}">

                                        Not Verified

                                    </span>

                                </td>

                            </tr>


                            <tr>

                                <th>
                                    Phone Verification
                                </th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${user.appUser != null and user.appUser.verified}">

                                        Verified

                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${user.appUser != null and user.appUser.verified}">

                                        Not Verified

                                    </span>

                                </td>

                            </tr>


                            <tr>

                                <th>
                                    Account Status
                                </th>

                                <td>

                                    <span class="badge bg-success"
                                          th:if="${user.active}">

                                        Active

                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${user.active}">

                                        Inactive

                                    </span>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
