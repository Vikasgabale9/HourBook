<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Profile</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>

<div class="hb-main">

    <div th:replace="~{user/fragments/header :: header}"></div>

    <main id="main-content" class="hb-content">

        <div class="row justify-content-center">

            <div class="col-xl-8 col-lg-10">

                <section class="card">

                    <div class="card-header
                                d-flex flex-wrap gap-2
                                justify-content-between
                                align-items-center">

                        <h1 class="h4 mb-0">

                            <i class="bi bi-person-circle text-primary" aria-hidden="true"></i>

                            My Profile

                        </h1>

                        <a th:href="@{/user/profile/edit}"
                           class="btn btn-primary btn-sm">

                            <i class="bi bi-pencil-square" aria-hidden="true"></i>

                            Edit Profile

                        </a>

                    </div>


                    <div class="card-body p-3 p-sm-4">

                        <!-- Profile Image -->

                        <div class="text-center mb-4">

                            <!-- Uploaded Profile Image -->

                            <img th:if="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 th:src="${user.profileImage}"
                                 class="hb-profile-avatar"
                                 width="150"
                                 height="150"
                                 alt="Profile Image">


                            <!-- Default Image -->

                            <img th:unless="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 src="https://placehold.co/150x150"
                                 class="hb-profile-avatar"
                                 width="150"
                                 height="150"
                                 alt="Default Profile Image">


                            <h2 class="h3 mt-3 fw-bold"
                                th:text="${user.fullName}">
                            </h2>

                            <p class="text-muted mb-0">

                                HourBook User

                            </p>

                        </div>


                        <!-- Profile Details -->

                        <dl class="hb-dl">

                            <div class="hb-dl__row">

                                <dt>User ID</dt>

                                <dd th:text="${user.id}">
                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>Full Name</dt>

                                <dd th:text="${user.fullName}">
                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>Email</dt>

                                <dd th:text="${user.email}">
                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>Phone Number</dt>

                                <dd th:text="${user.phoneNumber}">
                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>Email Verification</dt>

                                <dd>

                                    <span class="hb-badge hb-badge--success"
                                          th:if="${user.emailVerified}">

                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>

                                        Verified

                                    </span>

                                    <span class="hb-badge hb-badge--danger"
                                          th:unless="${user.emailVerified}">

                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>

                                        Not Verified

                                    </span>

                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>Phone Verification</dt>

                                <dd>

                                    <span class="hb-badge hb-badge--success"
                                          th:if="${user.appUser != null and user.appUser.verified}">

                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>

                                        Verified

                                    </span>

                                    <span class="hb-badge hb-badge--danger"
                                          th:unless="${user.appUser != null and user.appUser.verified}">

                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>

                                        Not Verified

                                    </span>

                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>Account Status</dt>

                                <dd>

                                    <span class="hb-badge hb-badge--success"
                                          th:if="${user.active}">

                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>

                                        Active

                                    </span>

                                    <span class="hb-badge hb-badge--danger"
                                          th:unless="${user.active}">

                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>

                                        Inactive

                                    </span>

                                </dd>

                            </div>

                        </dl>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
