<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Ground Details</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<!-- Sidebar -->
<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>


<div style="margin-left:260px;">

    <!-- Header -->
    <div th:replace="~{user/fragments/header :: header}"></div>


    <div class="container-fluid p-4">

		<!-- Booking/ground configuration errors -->
		<div class="alert alert-danger alert-dismissible fade show"
		     th:if="${error}"
		     role="alert">

		    <i class="bi bi-exclamation-triangle-fill"></i>

		    <span th:text="${error}"></span>

		    <button type="button"
		            class="btn-close"
		            data-bs-dismiss="alert"
		            aria-label="Close">
		    </button>
		</div>
		
        <!-- Back Button -->
        <a th:href="@{/user/grounds}"
           class="btn btn-secondary mb-4">

            <i class="bi bi-arrow-left"></i>
            Back

        </a>


        <div class="row g-4">

            <!-- ========================= -->
            <!-- Ground Images -->
            <!-- ========================= -->

            <div class="col-lg-7">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <!-- Images Available -->
                        <div class="row"
                             th:if="${ground.imageUrls != null and !ground.imageUrls.isEmpty()}">

                            <div class="col-md-6 mb-3"
                                 th:each="image : ${ground.imageUrls}">

                                <img
                                        th:src="@{${image}}"
                                        class="img-fluid rounded"
                                        style="height:250px;width:100%;object-fit:cover;"
                                        alt="Ground Image">

                            </div>

                        </div>


                        <!-- No Images -->
                        <div
                                th:if="${ground.imageUrls == null or ground.imageUrls.isEmpty()}">

                            <img
                                    src="https://placehold.co/800x500"
                                    class="img-fluid rounded w-100"
                                    alt="No Ground Image">

                        </div>

                    </div>

                </div>

            </div>


            <!-- ========================= -->
            <!-- Ground Details -->
            <!-- ========================= -->

            <div class="col-lg-5">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-header bg-primary text-white">

                        <h5 class="mb-0">

                            <i class="bi bi-building"></i>
                            Ground Information

                        </h5>

                    </div>


                    <div class="card-body">

                        <h3 class="fw-bold"
                            th:text="${ground.name}">

                            Ground Name

                        </h3>

                        <hr>


                        <table class="table table-hover">

                            <tr>

                                <th>
                                    <i class="bi bi-dribbble"></i>
                                    Sport
                                </th>

                                <td th:text="${ground.sports}"></td>

                            </tr>


                            <tr>

                                <th>
                                    <i class="bi bi-geo-alt"></i>
                                    Location
                                </th>

                                <td th:text="${ground.location}"></td>

                            </tr>


                            <tr>

                                <th>
                                    <i class="bi bi-grid"></i>
                                    Ground Type
                                </th>

                                <td th:text="${ground.type}"></td>

                            </tr>


                            <tr>

                                <th>
                                    <i class="bi bi-currency-rupee"></i>
                                    Price / Hour
                                </th>

                                <td>

                                    ₹
                                    <strong th:text="${ground.pricePerHour}"></strong>

                                </td>

                            </tr>


                            <!-- Operating Hours -->

                            <tr>

                                <th>
                                    <i class="bi bi-clock"></i>
                                    Opening Time
                                </th>

                                <td
                                        th:text="${ground.openingTime != null ? #temporals.format(ground.openingTime, 'hh:mm a') : 'Not specified'}">

                                </td>

                            </tr>


                            <tr>

                                <th>
                                    <i class="bi bi-clock-history"></i>
                                    Closing Time
                                </th>

                                <td
                                        th:text="${ground.closingTime != null ? #temporals.format(ground.closingTime, 'hh:mm a') : 'Not specified'}">

                                </td>

                            </tr>


                            <tr>

                                <th>Status</th>

                                <td>

                                    <span
                                            class="badge bg-success"
                                            th:if="${ground.isActive}">

                                        Available

                                    </span>

                                    <span
                                            class="badge bg-danger"
                                            th:unless="${ground.isActive}">

                                        Currently Unavailable

                                    </span>

                                </td>

                            </tr>

                        </table>


                        <!-- Amenities -->

                        <h5 class="mt-4">

                            <i class="bi bi-stars"></i>
                            Amenities

                        </h5>


                        <div class="mb-4">

                            <span
                                    class="badge bg-info text-dark me-2 mb-2"
                                    th:each="amenity : ${ground.amenities}"
                                    th:text="${amenity}">

                            </span>


                            <span
                                    class="text-muted"
                                    th:if="${ground.amenities == null or ground.amenities.isEmpty()}">

                                No amenities specified.

                            </span>

                        </div>


                        <!-- ========================= -->
                        <!-- Book Now -->
                        <!-- ========================= -->

                        <div class="d-grid">

                            <a
                                    th:if="${ground.isActive}"
                                    th:href="@{/user/bookings/ground/{id}(id=${ground.id})}"
                                    class="btn btn-success btn-lg">

                                <i class="bi bi-calendar-check"></i>

                                Book Now

                            </a>


                            <button
                                    th:unless="${ground.isActive}"
                                    class="btn btn-secondary btn-lg"
                                    disabled>

                                <i class="bi bi-x-circle"></i>

                                Ground Not Available

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
