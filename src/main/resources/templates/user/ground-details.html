<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Ground Details</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">

<!-- Sidebar -->
<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>


<div class="hb-main">

    <!-- Header -->
    <div th:replace="~{user/fragments/header :: header}"></div>


    <main id="main-content" class="hb-content">

        <!-- Booking/ground configuration errors -->
        <div class="alert alert-danger alert-dismissible fade show"
             th:if="${error}"
             role="alert">

            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>

            <span th:text="${error}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>
        </div>

        <!-- Back Button -->
        <a th:href="@{/user/grounds}"
           class="btn btn-outline-secondary mb-3">

            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            Back

        </a>


        <div class="row g-4">

            <!-- ========================= -->
            <!-- Ground Images -->
            <!-- ========================= -->

            <div class="col-lg-7">

                <section class="card border-0 h-100"
                         aria-label="Ground photos">

                    <div class="card-body">

                        <!-- Images Available -->
                        <div class="hb-gallery"
                             th:if="${ground.imageUrls != null and !ground.imageUrls.isEmpty()}">

                            <img
                                    th:each="image : ${ground.imageUrls}"
                                    th:src="${image}"
                                    th:alt="'Photo of ' + ${ground.name}"
                                    loading="lazy"
                                    alt="Ground Image">

                        </div>


                        <!-- No Images -->
                        <div class="hb-gallery hb-gallery--single"
                             th:if="${ground.imageUrls == null or ground.imageUrls.isEmpty()}">

                            <img
                                    src="https://placehold.co/800x500"
                                    alt="No ground photo available">

                        </div>

                    </div>

                </section>

            </div>


            <!-- ========================= -->
            <!-- Ground Details -->
            <!-- ========================= -->

            <div class="col-lg-5">

                <section class="card border-0 h-100">

                    <div class="card-header">

                        <h2 class="h5 mb-0">

                            <i class="bi bi-building text-primary" aria-hidden="true"></i>
                            Ground Information

                        </h2>

                    </div>


                    <div class="card-body">

                        <h1 class="h3 fw-bold mb-1"
                            th:text="${ground.name}">

                            Ground Name

                        </h1>

                        <p class="hb-price mb-3 pt-0">

                            ₹
                            <span th:text="${ground.pricePerHour}"></span>
                            <small>/ hour</small>

                        </p>


                        <dl class="hb-dl">

                            <div class="hb-dl__row">

                                <dt>
                                    <i class="bi bi-dribbble" aria-hidden="true"></i>
                                    Sport
                                </dt>

                                <dd th:text="${ground.sports}"></dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    <i class="bi bi-geo-alt" aria-hidden="true"></i>
                                    Location
                                </dt>

                                <dd th:text="${ground.location}"></dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    <i class="bi bi-grid" aria-hidden="true"></i>
                                    Ground Type
                                </dt>

                                <dd th:text="${ground.type}"></dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    <i class="bi bi-currency-rupee" aria-hidden="true"></i>
                                    Price / Hour
                                </dt>

                                <dd>

                                    ₹
                                    <strong th:text="${ground.pricePerHour}"></strong>

                                </dd>

                            </div>


                            <!-- Operating Hours -->

                            <div class="hb-dl__row">

                                <dt>
                                    <i class="bi bi-clock" aria-hidden="true"></i>
                                    Opening Time
                                </dt>

                                <dd
                                        th:text="${ground.openingTime != null ? #temporals.format(ground.openingTime, 'hh:mm a') : 'Not specified'}">

                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    <i class="bi bi-clock-history" aria-hidden="true"></i>
                                    Closing Time
                                </dt>

                                <dd
                                        th:text="${ground.closingTime != null ? #temporals.format(ground.closingTime, 'hh:mm a') : 'Not specified'}">

                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>Status</dt>

                                <dd>

                                    <span
                                            class="hb-badge hb-badge--success"
                                            th:if="${ground.isActive}">

                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                                        Available

                                    </span>

                                    <span
                                            class="hb-badge hb-badge--danger"
                                            th:unless="${ground.isActive}">

                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
                                        Currently Unavailable

                                    </span>

                                </dd>

                            </div>

                        </dl>


                        <!-- Amenities -->

                        <h2 class="h5 mt-4">

                            <i class="bi bi-stars text-primary" aria-hidden="true"></i>
                            Amenities

                        </h2>


                        <div class="hb-chips mb-4">

                            <span
                                    class="hb-chip"
                                    th:each="amenity : ${ground.amenities}"
                                    th:text="${amenity}">

                            </span>


                            <span
                                    class="text-muted"
                                    th:if="${ground.amenities == null or ground.amenities.isEmpty()}">

                                No amenities specified.

                            </span>

                        </div>


                        <!-- ========================= -->
                        <!-- Book Now -->
                        <!-- ========================= -->

                        <div class="d-grid">

                            <a
                                    th:if="${ground.isActive}"
                                    th:href="@{/user/bookings/ground/{id}(id=${ground.id})}"
                                    class="btn btn-primary btn-lg">

                                <i class="bi bi-calendar-check" aria-hidden="true"></i>

                                Book Now

                            </a>


                            <button
                                    th:unless="${ground.isActive}"
                                    class="btn btn-secondary btn-lg"
                                    disabled>

                                <i class="bi bi-x-circle" aria-hidden="true"></i>

                                Ground Not Available

                            </button>

                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
