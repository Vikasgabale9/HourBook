<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Profile</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">

<!-- Sidebar -->

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>


<!-- Main Content -->

<div class="hb-main">

    <!-- Header -->

    <div th:replace="~{user/fragments/header :: header}"></div>


    <!-- Page Content -->

    <main id="main-content" class="hb-content">

        <div class="row justify-content-center">

            <div class="col-xl-8 col-lg-10">

                <section class="card">

                    <!-- Card Header -->

                    <div class="card-header
                                d-flex flex-wrap gap-2
                                justify-content-between
                                align-items-center">

                        <h1 class="h4 mb-0">

                            <i class="bi bi-pencil-square text-primary" aria-hidden="true"></i>

                            Edit Profile

                        </h1>

                        <a th:href="@{/user/profile}"
                           class="btn btn-outline-secondary btn-sm">

                            <i class="bi bi-arrow-left" aria-hidden="true"></i>

                            Back to Profile

                        </a>

                    </div>


                    <!-- Card Body -->

                    <div class="card-body p-3 p-sm-4">

                        <!-- Profile Image Preview -->

                        <div class="text-center mb-4">

                            <!-- Existing image -->

                            <img th:if="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 th:src="@{${user.profileImage}}"
                                 id="profilePreview"
                                 class="hb-profile-avatar"
                                 width="150"
                                 height="150"
                                 alt="Profile Image">


                            <!-- Default image -->

                            <img th:unless="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 src="https://placehold.co/150x150"
                                 id="profilePreview"
                                 class="hb-profile-avatar"
                                 width="150"
                                 height="150"
                                 alt="Profile Image">

                        </div>


                        <!-- Profile Form -->

                        <form th:action="@{/user/profile/update}"
                              method="post"
                              enctype="multipart/form-data">

                            <!-- Full Name -->

                            <div class="mb-3">

                                <label for="fullName"
                                       class="form-label">

                                    Full Name

                                </label>

                                <input type="text"
                                       id="fullName"
                                       name="fullName"
                                       class="form-control"
                                       th:value="${user.fullName}"
                                       placeholder="Enter your full name"
                                       autocomplete="name"
                                       required>

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label for="email"
                                       class="form-label">

                                    Email

                                </label>

                                <input type="email"
                                       id="email"
                                       name="email"
                                       class="form-control"
                                       th:value="${user.email}"
                                       placeholder="Enter your email"
                                       autocomplete="email"
                                       required>

                            </div>


                            <!-- Phone Number -->

                            <div class="mb-3">

                                <label for="phoneDisplay"
                                       class="form-label">

                                    Phone Number

                                </label>

                                <input type="text"
                                       id="phoneDisplay"
                                       class="form-control"
                                       th:value="${user.phoneNumber}"
                                       aria-describedby="phoneHelp"
                                       readonly>

                                <div id="phoneHelp" class="form-text">

                                    Phone number cannot be changed here.

                                </div>

                            </div>


                            <!-- Profile Image -->

                            <div class="mb-4">

                                <label for="profileImage"
                                       class="form-label">

                                    Profile Image

                                </label>

                                <input type="file"
                                       id="profileImage"
                                       name="profileImage"
                                       class="form-control"
                                       aria-describedby="imageHelp"
                                       accept="image/*">

                                <div id="imageHelp" class="form-text">

                                    Select a JPG, JPEG, PNG or other image file.

                                </div>

                            </div>


                            <!-- Buttons -->

                            <div class="hb-booking-actions">

                                <button type="submit"
                                        class="btn btn-primary">

                                    <i class="bi bi-check-circle" aria-hidden="true"></i>

                                    Save Changes

                                </button>


                                <a th:href="@{/user/profile}"
                                   class="btn btn-outline-secondary">

                                    <i class="bi bi-x-circle" aria-hidden="true"></i>

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Image Preview -->

<script>

    const profileImage =
        document.getElementById("profileImage");

    const profilePreview =
        document.getElementById("profilePreview");


    profileImage.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {

            profilePreview.src =
                URL.createObjectURL(file);

        }

    });

</script>

</body>

</html>
