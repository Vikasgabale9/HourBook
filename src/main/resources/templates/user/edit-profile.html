<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Profile</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Sidebar -->

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>


<!-- Main Content -->

<div style="margin-left:260px;">

    <!-- Header -->

    <div th:replace="~{user/fragments/header :: header}"></div>


    <!-- Page Content -->

    <div class="container-fluid p-4">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <!-- Card Header -->

                    <div class="card-header bg-primary text-white
                                d-flex justify-content-between
                                align-items-center">

                        <h4 class="mb-0">

                            <i class="bi bi-pencil-square"></i>

                            Edit Profile

                        </h4>

                        <a th:href="@{/user/profile}"
                           class="btn btn-light btn-sm">

                            <i class="bi bi-arrow-left"></i>

                            Back to Profile

                        </a>

                    </div>


                    <!-- Card Body -->

                    <div class="card-body p-4">

                        <!-- Profile Image Preview -->

                        <div class="text-center mb-4">

                            <!-- Existing image -->

                            <img th:if="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 th:src="@{${user.profileImage}}"
                                 id="profilePreview"
                                 class="rounded-circle border shadow"
                                 width="150"
                                 height="150"
                                 style="object-fit: cover;"
                                 alt="Profile Image">


                            <!-- Default image -->

                            <img th:unless="${user.profileImage != null and !user.profileImage.isEmpty()}"
                                 src="https://placehold.co/150x150"
                                 id="profilePreview"
                                 class="rounded-circle border shadow"
                                 width="150"
                                 height="150"
                                 style="object-fit: cover;"
                                 alt="Profile Image">

                        </div>


                        <!-- Profile Form -->

                        <form th:action="@{/user/profile/update}"
                              method="post"
                              enctype="multipart/form-data">

                            <!-- Full Name -->

                            <div class="mb-3">

                                <label for="fullName"
                                       class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input type="text"
                                       id="fullName"
                                       name="fullName"
                                       class="form-control"
                                       th:value="${user.fullName}"
                                       placeholder="Enter your full name"
                                       required>

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label for="email"
                                       class="form-label fw-semibold">

                                    Email

                                </label>

                                <input type="email"
                                       id="email"
                                       name="email"
                                       class="form-control"
                                       th:value="${user.email}"
                                       placeholder="Enter your email"
                                       required>

                            </div>


                            <!-- Phone Number -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    Phone Number

                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:value="${user.phoneNumber}"
                                       readonly>

                                <div class="form-text">

                                    Phone number cannot be changed here.

                                </div>

                            </div>


                            <!-- Profile Image -->

                            <div class="mb-4">

                                <label for="profileImage"
                                       class="form-label fw-semibold">

                                    Profile Image

                                </label>

                                <input type="file"
                                       id="profileImage"
                                       name="profileImage"
                                       class="form-control"
                                       accept="image/*">

                                <div class="form-text">

                                    Select a JPG, JPEG, PNG or other image file.

                                </div>

                            </div>


                            <!-- Buttons -->

                            <div class="d-flex gap-2">

                                <button type="submit"
                                        class="btn btn-primary">

                                    <i class="bi bi-check-circle"></i>

                                    Save Changes

                                </button>


                                <a th:href="@{/user/profile}"
                                   class="btn btn-secondary">

                                    <i class="bi bi-x-circle"></i>

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Image Preview -->

<script>

    const profileImage =
        document.getElementById("profileImage");

    const profilePreview =
        document.getElementById("profilePreview");


    profileImage.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {

            profilePreview.src =
                URL.createObjectURL(file);

        }

    });

</script>

</body>

</html>
