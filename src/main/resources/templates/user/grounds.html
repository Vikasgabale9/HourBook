<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Browse Grounds - HourBook</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Inter font (falls back to system fonts if unavailable) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <!-- HourBook User Panel design system -->
    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">


<!-- ================= SIDEBAR ================= -->

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>


<!-- ================= MAIN CONTENT ================= -->

<div class="hb-main">

    <!-- Header -->

    <div th:replace="~{user/fragments/header :: header}"></div>


    <main id="main-content" class="hb-content">


        <!-- ================= PAGE HEADER ================= -->

        <div class="hb-page-head">

            <div>

                <h1 class="hb-title">

                    <i class="bi bi-building" aria-hidden="true"></i>

                    Browse Grounds

                </h1>

                <p class="hb-subtitle">

                    Find your favorite sports ground.

                </p>

            </div>

        </div>


        <!-- ================= SEARCH ================= -->

        <form
                class="hb-filter card"
                method="get"
                role="search"
                th:action="@{/user/grounds}">


            <!-- Preserve page size -->

            <input
                    type="hidden"
                    name="size"
                    th:value="${groundPage.size}">


            <div class="hb-filter__row">

                <!-- Search -->

                <div class="hb-filter__search">

                    <label for="groundSearch" class="visually-hidden">

                        Search by ground name

                    </label>

                    <div class="input-group">

                        <span class="input-group-text" aria-hidden="true">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                                type="text"
                                id="groundSearch"
                                class="form-control"
                                name="search"
                                placeholder="Search by Ground Name"
                                th:value="${search}">

                    </div>

                </div>


                <div class="hb-filter__actions">

                    <!-- Search Button -->

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-search" aria-hidden="true"></i>

                        Search

                    </button>


                    <!-- Reset -->

                    <a
                            th:href="@{/user/grounds}"
                            class="btn btn-outline-secondary">

                        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>

                        Reset

                    </a>

                </div>

            </div>

        </form>


        <p class="hb-count"
           th:if="${groundPage.totalElements > 0}">

            <strong th:text="${groundPage.totalElements}">0</strong>

            grounds found

        </p>


        <!-- ================= GROUND CARDS ================= -->

        <div class="hb-ground-grid">


            <article
                    class="hb-ground-card"
                    th:each="ground : ${grounds}">


                <!-- ================= GROUND IMAGE ================= -->

                <div class="hb-ground-media">

                    <img
                            th:if="${ground.imageUrls != null and !ground.imageUrls.isEmpty()}"
                            th:src="${ground.imageUrls[0]}"
                            th:alt="'Photo of ' + ${ground.name}"
                            loading="lazy"
                            alt="Ground Image">


                    <!-- No Image -->

                    <img
                            th:unless="${ground.imageUrls != null and !ground.imageUrls.isEmpty()}"
                            src="https://placehold.co/600x400?text=Ground"
                            loading="lazy"
                            alt="No ground photo available">


                    <!-- Status -->

                    <span class="hb-badge hb-badge--success">

                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>

                        Available

                    </span>

                </div>


                <!-- ================= CARD BODY ================= -->

                <div class="hb-ground-body">


                    <!-- Ground Name -->

                    <h2
                            class="hb-ground-name"
                            th:text="${ground.name}">

                        Ground Name

                    </h2>


                    <!-- Location -->

                    <p class="hb-meta">

                        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>

                        <span
                                th:text="${ground.location}">
                            Location
                        </span>

                    </p>


                    <!-- Sports -->

                    <p class="hb-meta">

                        <i class="bi bi-dribbble" aria-hidden="true"></i>

                        <span
                                th:text="${ground.sports}">
                            Sports
                        </span>

                    </p>


                    <!-- Ground Type -->

                    <p class="hb-meta">

                        <i class="bi bi-grid" aria-hidden="true"></i>

                        <span>

                            Type:

                            <span
                                    th:text="${ground.type}">
                                Ground Type
                            </span>

                        </span>

                    </p>


                    <!-- Price -->

                    <p class="hb-price">

                        ₹

                        <span
                                th:text="${ground.pricePerHour}">
                            0
                        </span>

                        <small>/ hour</small>

                    </p>


                </div>


                <!-- ================= CARD FOOTER ================= -->

                <div class="hb-ground-foot">


                    <a
                            th:href="@{/user/grounds/{id}(id=${ground.id})}"
                            class="btn btn-primary w-100">

                        <i class="bi bi-eye" aria-hidden="true"></i>

                        View Details

                    </a>


                </div>

            </article>

        </div>


        <!-- ================= NO DATA ================= -->

        <div
                class="card hb-empty mt-4"
                th:if="${groundPage.totalElements == 0}">

            <i class="bi bi-search" aria-hidden="true"></i>

            <h2>

                No Grounds Found

            </h2>

            <p class="text-muted mb-0">

                Try searching with a different ground name.

            </p>

        </div>


        <!-- ================= PAGINATION ================= -->

        <div
                class="mt-5"
                th:if="${groundPage.totalPages > 1}">


            <!-- Page Information -->

            <div class="text-center mb-3">

                <strong>

                    Page

                    <span
                            th:text="${groundPage.number + 1}">
                        1
                    </span>

                    of

                    <span
                            th:text="${groundPage.totalPages}">
                        1
                    </span>

                </strong>

            </div>


            <nav aria-label="Ground pages">

                <ul class="pagination justify-content-center">


                    <!-- ================= PREVIOUS ================= -->

                    <li
                            class="page-item"
                            th:classappend="${groundPage.first} ? 'disabled'">


                        <a
                                class="page-link"
                                th:href="@{/user/grounds(
                                    page=${groundPage.number - 1},
                                    size=${groundPage.size},
                                    search=${search}
                                )}">

                            <i class="bi bi-chevron-left" aria-hidden="true"></i>

                            Previous

                        </a>

                    </li>


                    <!-- ================= PAGE NUMBERS ================= -->
                    <!-- On phones only the current page number is shown -->

                    <li
                            class="page-item hb-page-num"
                            th:each="i : ${#numbers.sequence(
                                0,
                                groundPage.totalPages - 1
                            )}"
                            th:classappend="${i == groundPage.number} ? 'active'">


                        <a
                                class="page-link"
                                th:text="${i + 1}"
                                th:href="@{/user/grounds(
                                    page=${i},
                                    size=${groundPage.size},
                                    search=${search}
                                )}">

                            1

                        </a>

                    </li>


                    <!-- ================= NEXT ================= -->

                    <li
                            class="page-item"
                            th:classappend="${groundPage.last} ? 'disabled'">


                        <a
                                class="page-link"
                                th:href="@{/user/grounds(
                                    page=${groundPage.number + 1},
                                    size=${groundPage.size},
                                    search=${search}
                                )}">

                            Next

                            <i class="bi bi-chevron-right" aria-hidden="true"></i>

                        </a>

                    </li>

                </ul>

            </nav>

        </div>


    </main>


    <!-- ================= FOOTER ================= -->

    <div th:replace="~{user/fragments/footer :: footer}"></div>


</div>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
