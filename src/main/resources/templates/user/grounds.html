<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Browse Grounds</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>

<div style="margin-left:260px;">

    <div th:replace="~{user/fragments/header :: header}"></div>

    <div class="container-fluid p-4">

        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">

                    <i class="bi bi-building text-primary"></i>

                    Browse Grounds

                </h2>

                <p class="text-muted mb-0">

                    Find your favorite sports ground.

                </p>

            </div>

        </div>

        <!-- Search -->

        <form class="row g-2 mb-4"
              method="get"
              th:action="@{/user/grounds}">

            <input type="hidden"
                   name="size"
                   th:value="${groundPage.size}">

            <div class="col-md-6">

                <input type="text"
                       class="form-control"
                       name="search"
                       placeholder="Search by Ground Name"
                       th:value="${search}">

            </div>

            <div class="col-md-2">

                <button class="btn btn-primary w-100">

                    <i class="bi bi-search"></i>

                    Search

                </button>

            </div>

            <div class="col-md-2">

                <a th:href="@{/user/grounds}"
                   class="btn btn-outline-secondary w-100">

                    Reset

                </a>

            </div>

        </form>

        <!-- Cards -->

        <div class="row g-4">

            <div class="col-lg-4 col-md-6"

                 th:each="ground : ${grounds}">

                <div class="card shadow-sm h-100 border-0">

                    <img th:if="${ground.imageUrls != null and !ground.imageUrls.isEmpty()}"
                         th:src="@{${ground.imageUrls[0]}}"
                         class="card-img-top"
                         style="height:220px;object-fit:cover;">

                    <img th:unless="${ground.imageUrls != null and !ground.imageUrls.isEmpty()}"
                         src="https://placehold.co/600x400?text=Ground"
                         class="card-img-top"
                         style="height:220px;object-fit:cover;">

                    <div class="card-body">

                        <h4 class="fw-bold"
                            th:text="${ground.name}"></h4>

                        <p class="mb-2">

                            <i class="bi bi-geo-alt-fill text-danger"></i>

                            <span th:text="${ground.location}"></span>

                        </p>

                        <p class="mb-2">

                            <i class="bi bi-dribbble text-success"></i>

                            <span th:text="${ground.sports}"></span>

                        </p>

                        <p class="mb-2">

                            <i class="bi bi-currency-rupee"></i>

                            <strong th:text="${ground.pricePerHour}"></strong>

                            / Hour

                        </p>

                        <p class="mb-3">

                            <strong>Type :</strong>

                            <span th:text="${ground.type}"></span>

                        </p>

                        <span class="badge bg-success">

                            Available

                        </span>

                    </div>

                    <div class="card-footer bg-white border-0">

                        <a th:href="@{/user/grounds/{id}(id=${ground.id})}"
                           class="btn btn-primary w-100">

                            <i class="bi bi-eye"></i>

                            View Details

                        </a>

                    </div>

                </div>

            </div>

        </div>

        <!-- No Data -->

        <div class="alert alert-warning mt-4 text-center"
             th:if="${groundPage.totalElements==0}">

            <h5 class="mb-0">

                No Grounds Found

            </h5>

        </div>

        <!-- Pagination -->

        <div class="mt-5"
             th:if="${groundPage.totalPages > 1}">

            <div class="text-center mb-3">

                <strong>

                    Page

                    <span th:text="${groundPage.number+1}"></span>

                    of

                    <span th:text="${groundPage.totalPages}"></span>

                </strong>

            </div>

            <nav>

                <ul class="pagination justify-content-center">

                    <!-- Previous -->

                    <li class="page-item"
                        th:classappend="${groundPage.first}? 'disabled'">

                        <a class="page-link"

                           th:href="@{/user/grounds(page=${groundPage.number-1},
                                                    size=${groundPage.size},
                                                    search=${search})}">

                            Previous

                        </a>

                    </li>

                    <!-- Pages -->

                    <li class="page-item"

                        th:each="i : ${#numbers.sequence(0, groundPage.totalPages-1)}"

                        th:classappend="${i==groundPage.number}? 'active'">

                        <a class="page-link"

                           th:text="${i+1}"

                           th:href="@{/user/grounds(page=${i},
                                                    size=${groundPage.size},
                                                    search=${search})}">

                        </a>

                    </li>

                    <!-- Next -->

                    <li class="page-item"

                        th:classappend="${groundPage.last}? 'disabled'">

                        <a class="page-link"

                           th:href="@{/user/grounds(page=${groundPage.number+1},
                                                    size=${groundPage.size},
                                                    search=${search})}">

                            Next

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
