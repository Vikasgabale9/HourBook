<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="sidebar">

    <a class="hb-skip" href="#main-content">Skip to main content</a>

    <!-- Fixed sidebar on desktop (lg+), slide-in drawer on phones and tablets -->
    <aside id="hbSidebar"
           class="hb-sidebar offcanvas-lg offcanvas-start"
           tabindex="-1"
           aria-labelledby="hbSidebarLabel">

        <div class="hb-sidebar__inner">

            <div class="hb-sidebar__top">

                <a th:href="@{/user/dashboard}"
                   id="hbSidebarLabel"
                   class="hb-brand">

                    <!-- Logo: src/main/resources/static/images/logo.svg -->
                    <img th:src="@{/images/logo.svg}"
                         src="/images/logo.svg"
                         alt=""
                         width="36"
                         height="36">

                    HourBook

                </a>

                <button type="button"
                        class="btn-close btn-close-white d-lg-none"
                        data-bs-dismiss="offcanvas"
                        data-bs-target="#hbSidebar"
                        aria-label="Close navigation">
                </button>

            </div>

            <nav aria-label="User navigation" class="d-flex flex-column flex-grow-1">

                <ul class="hb-nav">

                    <li>
                        <a th:href="@{/user/dashboard}"
                           data-hb-nav="/user/dashboard">

                            <i class="bi bi-speedometer2" aria-hidden="true"></i>
                            Dashboard

                        </a>
                    </li>

                    <li>
                        <a th:href="@{/user/grounds}"
                           data-hb-nav="/user/grounds">

                            <i class="bi bi-building" aria-hidden="true"></i>
                            Browse Grounds

                        </a>
                    </li>

                    <li>
                        <a th:href="@{/user/bookings}"
                           data-hb-nav="/user/bookings">

                            <i class="bi bi-calendar-check" aria-hidden="true"></i>
                            My Bookings

                        </a>
                    </li>

                    <li>
                        <a th:href="@{/user/profile}"
                           data-hb-nav="/user/profile">

                            <i class="bi bi-person-circle" aria-hidden="true"></i>
                            My Profile

                        </a>
                    </li>

                    <li class="hb-nav__logout">
                        <a th:href="@{/user/logout}">

                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                            Logout

                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </aside>

    <!-- Marks the current section in the navigation -->
    <script>
        (function () {

            var path = window.location.pathname.replace(/\/+$/, "");
            var start = path.indexOf("/user/");

            if (start > -1) {
                path = path.substring(start);
            }

            // Order matters: the slot-booking page belongs to "Browse Grounds"
            var rules = [
                ["/user/bookings/ground", "/user/grounds"],
                ["/user/bookings", "/user/bookings"],
                ["/user/grounds", "/user/grounds"],
                ["/user/profile", "/user/profile"],
                ["/user/dashboard", "/user/dashboard"]
            ];

            var target = null;

            for (var i = 0; i < rules.length; i++) {
                if (path === rules[i][0] || path.indexOf(rules[i][0] + "/") === 0) {
                    target = rules[i][1];
                    break;
                }
            }

            document.querySelectorAll("#hbSidebar [data-hb-nav]").forEach(function (link) {
                if (link.getAttribute("data-hb-nav") === target) {
                    link.classList.add("active");
                    link.setAttribute("aria-current", "page");
                }
            });

        })();
    </script>

</div>

</body>

</html>
