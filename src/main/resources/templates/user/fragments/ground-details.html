<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Ground Details</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>

<div style="margin-left:260px;">

    <div th:replace="~{user/fragments/header :: header}"></div>

    <div class="container-fluid p-4">

        <div class="row">

            <!-- Images -->

            <div class="col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <div class="row">

                            <div class="col-md-6 mb-3"

                                 th:each="image : ${ground.imageUrls}">

                                <img

                                        th:src="@{${image}}"

                                        class="img-fluid rounded"

                                        style="height:250px;width:100%;object-fit:cover;">

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Ground Information -->

            <div class="col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2

                                th:text="${ground.name}">

                        </h2>

                        <hr>

                        <p>

                            <i class="bi bi-geo-alt-fill text-danger"></i>

                            <strong>Location :</strong>

                            <span

                                    th:text="${ground.location}">

                            </span>

                        </p>

                        <p>

                            <i class="bi bi-dribbble text-success"></i>

                            <strong>Sports :</strong>

                            <span

                                    th:text="${ground.sports}">

                            </span>

                        </p>

                        <p>

                            <strong>Ground Type :</strong>

                            <span

                                    th:text="${ground.type}">

                            </span>

                        </p>

                        <p>

                            <strong>Price :</strong>

                            ₹

                            <span

                                    th:text="${ground.pricePerHour}">

                            </span>

                            / Hour

                        </p>

                        <p>

                            <strong>Status :</strong>

                            <span

                                    class="badge bg-success">

                                Available

                            </span>

                        </p>

                        <hr>

                        <h5>

                            Amenities

                        </h5>

                        <ul>

                            <li

                                    th:each="amenity : ${ground.amenities}"

                                    th:text="${amenity}">

                            </li>

                        </ul>

                        <hr>

                        <div class="d-grid gap-2">

                            <a

                               th:href="@{/user/book/{id}(id=${ground.id})}"

                               class="btn btn-success btn-lg">

                                <i class="bi bi-calendar-check"></i>

                                Book Now

                            </a>

                            <a

                               th:href="@{/user/grounds}"

                               class="btn btn-secondary">

                                Back

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
