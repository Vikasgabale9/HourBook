<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Complete Payment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Sidebar -->

    <div th:replace="~{user/fragments/sidebar :: sidebar}">
    </div>


    <div style="margin-left:260px;">

        <!-- Header -->

        <div th:replace="~{user/fragments/header :: header}">
        </div>


        <div class="container-fluid p-4">

            <div class="row justify-content-center">

                <div class="col-md-7 col-lg-6">

                    <div class="card shadow border-0">

                        <!-- Header -->

                        <div class="card-header bg-primary text-white">

                            <h4 class="mb-0">

                                <i class="bi bi-credit-card"></i>

                                Complete Your Payment

                            </h4>

                        </div>


                        <div class="card-body p-4">

                            <!-- Booking Details -->

                            <h5 class="mb-3">
                                Booking Details
                            </h5>


                            <div class="table-responsive">

                                <table class="table">

                                    <tr>

                                        <th>
                                            Booking ID
                                        </th>

                                        <td
                                            th:text="${booking.id}">
                                        </td>

                                    </tr>


                                    <tr>

                                        <th>
                                            Ground
                                        </th>

                                        <td
                                            th:text="${booking.ground.name}">
                                            Ground Name
                                        </td>

                                    </tr>


                                    <tr>

                                        <th>
                                            Date
                                        </th>

                                        <td
                                            th:text="${#temporals.format(
                                                booking.bookingDate,
                                                'dd MMM yyyy'
                                            )}">
                                        </td>

                                    </tr>


                                    <tr>

                                        <th>
                                            Time
                                        </th>

                                        <td>

                                            <span
                                                th:text="${#temporals.format(
                                                    booking.startTime,
                                                    'hh:mm a'
                                                )}">
                                            </span>

                                            -

                                            <span
                                                th:text="${#temporals.format(
                                                    booking.endTime,
                                                    'hh:mm a'
                                                )}">
                                            </span>

                                        </td>

                                    </tr>


                                    <tr>

                                        <th>
                                            Total Amount
                                        </th>

                                        <td
                                            class="fw-bold text-success">

                                            ₹

                                            <span
                                                th:text="${booking.totalAmount}">
                                            </span>

                                        </td>

                                    </tr>

                                </table>

                            </div>


                            <!-- Payment Button -->

                            <div class="d-grid mt-4">

                                <button
                                    type="button"
                                    id="pay-button"
                                    class="btn btn-success btn-lg">

                                    <i class="bi bi-lock-fill"></i>

                                    Pay Securely with Razorpay

                                </button>

                            </div>


                            <p
                                class="text-center text-muted mt-3 mb-0">

                                <i class="bi bi-shield-check"></i>

                                Secure payment powered by Razorpay

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Footer -->

        <div th:replace="~{user/fragments/footer :: footer}">
        </div>

    </div>


    <!-- ========================================= -->
    <!-- Hidden Payment Verification Form -->
    <!-- ========================================= -->

    <form
        id="payment-form"
        method="post"
        th:action="@{/user/bookings/verify-payment}">

        <input
            type="hidden"
            name="bookingId"
            th:value="${booking.id}">

        <input
            type="hidden"
            name="razorpayOrderId"
            id="razorpayOrderId">

        <input
            type="hidden"
            name="razorpayPaymentId"
            id="razorpayPaymentId">

        <input
            type="hidden"
            name="razorpaySignature"
            id="razorpaySignature">

    </form>


    <!-- ========================================= -->
    <!-- Razorpay Checkout Script -->
    <!-- ========================================= -->

    <script
        src="https://checkout.razorpay.com/v1/checkout.js">
    </script>


    <!-- ========================================= -->
    <!-- Razorpay JavaScript -->
    <!-- ========================================= -->

    <script th:inline="javascript">

        /*
         * ========================================
         * Get values from Spring Boot
         * ========================================
         */

        const razorpayKeyId =
            /*[[${razorpayKeyId}]]*/ "";

        const razorpayAmount =
            /*[[${razorpayAmount}]]*/ 0;

        const razorpayOrderId =
            /*[[${razorpayOrderId}]]*/ "";


        /*
         * ========================================
         * Debug Information
         * ========================================
         */

        console.log(
            "========================================"
        );

        console.log(
            "Razorpay Payment Page"
        );

        console.log(
            "Razorpay Key:",
            razorpayKeyId
        );

        console.log(
            "Razorpay Amount:",
            razorpayAmount
        );

        console.log(
            "Razorpay Order:",
            razorpayOrderId
        );

        console.log(
            "========================================"
        );


        /*
         * ========================================
         * Validate Razorpay Data
         * ========================================
         */

        if (!razorpayKeyId) {

            alert(
                "Razorpay Key ID is missing."
            );

            throw new Error(
                "Razorpay Key ID is missing"
            );
        }


        if (!razorpayAmount
                || razorpayAmount <= 0) {

            alert(
                "Invalid payment amount."
            );

            throw new Error(
                "Invalid Razorpay amount"
            );
        }


        if (!razorpayOrderId) {

            alert(
                "Razorpay Order ID is missing."
            );

            throw new Error(
                "Razorpay Order ID is missing"
            );
        }


        /*
         * ========================================
         * Razorpay Options
         * ========================================
         */

        const razorpayOptions = {

            key: razorpayKeyId,

            amount: razorpayAmount,

            currency: "INR",

            name: "HourBook",

            description: "Ground Slot Booking",

            order_id: razorpayOrderId,


            /*
             * ====================================
             * Payment Success
             * ====================================
             */

            handler: function(response) {

                console.log(
                    "Razorpay payment successful"
                );

                console.log(
                    "Razorpay response:",
                    response
                );


                /*
                 * Save Razorpay response
                 */

                document.getElementById(
                    "razorpayOrderId"
                ).value =
                    response.razorpay_order_id;


                document.getElementById(
                    "razorpayPaymentId"
                ).value =
                    response.razorpay_payment_id;


                document.getElementById(
                    "razorpaySignature"
                ).value =
                    response.razorpay_signature;


                /*
                 * Validate response
                 */

                if (!response.razorpay_order_id
                        || !response.razorpay_payment_id
                        || !response.razorpay_signature) {

                    alert(
                        "Payment response is incomplete."
                    );

                    return;
                }


                /*
                 * Submit to Spring Boot
                 */

                document.getElementById(
                    "payment-form"
                ).submit();

            },


            /*
             * ====================================
             * Payment Failure
             * ====================================
             */

            modal: {

                ondismiss: function() {

                    console.log(
                        "Razorpay payment popup closed"
                    );

                }

            },


            /*
             * Theme
             */

            theme: {

                color: "#0d6efd"

            }

        };


        /*
         * ========================================
         * Create Razorpay Instance
         * ========================================
         */

        const razorpay =
            new Razorpay(
                razorpayOptions
            );


        /*
         * ========================================
         * Razorpay Error Handler
         * ========================================
         */

        razorpay.on(
            "payment.failed",
            function(response) {

                console.error(
                    "Razorpay payment failed:",
                    response
                );

                alert(
                    "Payment failed. Please try again."
                );

            }
        );


        /*
         * ========================================
         * Pay Button
         * ========================================
         */

        document
            .getElementById("pay-button")
            .addEventListener(
                "click",
                function() {

                    console.log(
                        "Opening Razorpay Checkout..."
                    );

                    razorpay.open();

                }
            );

    </script>


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
