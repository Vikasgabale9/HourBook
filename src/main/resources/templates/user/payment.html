<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Complete Payment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">

<!-- Sidebar -->

<div th:replace="~{user/fragments/sidebar :: sidebar}">
</div>


<div class="hb-main">

    <!-- Header -->

    <div th:replace="~{user/fragments/header :: header}">
    </div>


    <main id="main-content" class="hb-content">

        <div class="row justify-content-center">

            <div class="col-md-9 col-lg-7 col-xl-6">

                <section class="card">

                    <!-- Header -->

                    <div class="card-header">

                        <h1 class="h4 mb-0">

                            <i class="bi bi-credit-card text-primary" aria-hidden="true"></i>

                            Complete Your Payment

                        </h1>

                    </div>


                    <div class="card-body p-3 p-sm-4">

                        <!-- Booking Details -->

                        <h2 class="h5 mb-2">
                            Booking Details
                        </h2>


                        <dl class="hb-dl">

                            <div class="hb-dl__row">

                                <dt>
                                    Booking ID
                                </dt>

                                <dd
                                        th:text="${booking.id}">
                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    Ground
                                </dt>

                                <dd
                                        th:text="${booking.ground.name}">
                                    Ground Name
                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    Date
                                </dt>

                                <dd
                                        th:text="${#temporals.format(
                                            booking.bookingDate,
                                            'dd MMM yyyy'
                                        )}">
                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    Time
                                </dt>

                                <dd>

                                        <span
                                                th:text="${#temporals.format(
                                                booking.startTime,
                                                'hh:mm a'
                                            )}">
                                        </span>

                                    -

                                    <span
                                            th:text="${#temporals.format(
                                                booking.endTime,
                                                'hh:mm a'
                                            )}">
                                        </span>

                                </dd>

                            </div>


                            <div class="hb-dl__row">

                                <dt>
                                    Total Amount
                                </dt>

                                <dd class="hb-amount">

                                    ₹

                                    <span
                                            th:text="${booking.totalAmount}">
                                        </span>

                                </dd>

                            </div>

                        </dl>


                        <!-- Payment Button -->

                        <div class="d-grid mt-4">

                            <button
                                    type="button"
                                    id="pay-button"
                                    class="btn btn-primary btn-lg">

                                <i class="bi bi-lock-fill" aria-hidden="true"></i>

                                Pay Securely with Razorpay

                            </button>

                        </div>


                        <p
                                class="text-center text-muted mt-3 mb-0">

                            <i class="bi bi-shield-check" aria-hidden="true"></i>

                            Secure payment powered by Razorpay

                        </p>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <div th:replace="~{user/fragments/footer :: footer}">
    </div>

</div>


<!-- ========================================= -->
<!-- Hidden Payment Verification Form -->
<!-- ========================================= -->

<form
        id="payment-form"
        method="post"
        th:action="@{/user/bookings/verify-payment}">

    <input
            type="hidden"
            name="bookingId"
            th:value="${booking.id}">

    <input
            type="hidden"
            name="razorpayOrderId"
            id="razorpayOrderId">

    <input
            type="hidden"
            name="razorpayPaymentId"
            id="razorpayPaymentId">

    <input
            type="hidden"
            name="razorpaySignature"
            id="razorpaySignature">

</form>


<!-- ========================================= -->
<!-- Razorpay Checkout Script -->
<!-- ========================================= -->

<script
        src="https://checkout.razorpay.com/v1/checkout.js">
</script>


<!-- ========================================= -->
<!-- Razorpay JavaScript -->
<!-- ========================================= -->

<script th:inline="javascript">

    /*
     * ========================================
     * Get values from Spring Boot
     * ========================================
     */

    const razorpayKeyId =
        /*[[${razorpayKeyId}]]*/ "";

    const razorpayAmount =
        /*[[${razorpayAmount}]]*/ 0;

    const razorpayOrderId =
        /*[[${razorpayOrderId}]]*/ "";


    /*
     * ========================================
     * Debug Information
     * ========================================
     */

    console.log(
        "========================================"
    );

    console.log(
        "Razorpay Payment Page"
    );

    console.log(
        "Razorpay Key:",
        razorpayKeyId
    );

    console.log(
        "Razorpay Amount:",
        razorpayAmount
    );

    console.log(
        "Razorpay Order:",
        razorpayOrderId
    );

    console.log(
        "========================================"
    );


    /*
     * ========================================
     * Validate Razorpay Data
     * ========================================
     */

    if (!razorpayKeyId) {

        alert(
            "Razorpay Key ID is missing."
        );

        throw new Error(
            "Razorpay Key ID is missing"
        );
    }


    if (!razorpayAmount
        || razorpayAmount <= 0) {

        alert(
            "Invalid payment amount."
        );

        throw new Error(
            "Invalid Razorpay amount"
        );
    }


    if (!razorpayOrderId) {

        alert(
            "Razorpay Order ID is missing."
        );

        throw new Error(
            "Razorpay Order ID is missing"
        );
    }


    /*
     * ========================================
     * Razorpay Options
     * ========================================
     */

    const razorpayOptions = {

        key: razorpayKeyId,

        amount: razorpayAmount,

        currency: "INR",

        name: "HourBook",

        description: "Ground Slot Booking",

        order_id: razorpayOrderId,


        /*
         * ====================================
         * Payment Success
         * ====================================
         */

        handler: function(response) {

            console.log(
                "Razorpay payment successful"
            );

            console.log(
                "Razorpay response:",
                response
            );


            /*
             * Save Razorpay response
             */

            document.getElementById(
                "razorpayOrderId"
            ).value =
                response.razorpay_order_id;


            document.getElementById(
                "razorpayPaymentId"
            ).value =
                response.razorpay_payment_id;


            document.getElementById(
                "razorpaySignature"
            ).value =
                response.razorpay_signature;


            /*
             * Validate response
             */

            if (!response.razorpay_order_id
                || !response.razorpay_payment_id
                || !response.razorpay_signature) {

                alert(
                    "Payment response is incomplete."
                );

                return;
            }


            /*
             * Submit to Spring Boot
             */

            document.getElementById(
                "payment-form"
            ).submit();

        },


        /*
         * ====================================
         * Payment Failure
         * ====================================
         */

        modal: {

            ondismiss: function() {

                console.log(
                    "Razorpay payment popup closed"
                );

            }

        },


        /*
         * Theme
         */

        theme: {

            color: "#4338CA"

        }

    };


    /*
     * ========================================
     * Create Razorpay Instance
     * ========================================
     */

    const razorpay =
        new Razorpay(
            razorpayOptions
        );


    /*
     * ========================================
     * Razorpay Error Handler
     * ========================================
     */

    razorpay.on(
        "payment.failed",
        function(response) {

            console.error(
                "Razorpay payment failed:",
                response
            );

            alert(
                "Payment failed. Please try again."
            );

        }
    );


    /*
     * ========================================
     * Pay Button
     * ========================================
     */

    document
        .getElementById("pay-button")
        .addEventListener(
            "click",
            function() {

                console.log(
                    "Opening Razorpay Checkout..."
                );

                razorpay.open();

            }
        );

</script>


<!-- Bootstrap -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
