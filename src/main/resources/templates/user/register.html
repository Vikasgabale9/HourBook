<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>User Registration | HourBook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- HourBook User Panel design system -->
    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">

<main class="hb-auth">

    <div class="hb-auth__card hb-auth__card--wide">

        <!-- Header -->

        <div class="hb-auth__head">

            <i class="bi bi-calendar-check-fill" aria-hidden="true"></i>

            <h1 class="hb-auth__brand">
                HourBook
            </h1>

            <p class="hb-auth__sub">
                Create Your Account
            </p>

        </div>


        <!-- Body -->

        <div class="hb-auth__body">

            <!-- General Error -->

            <div th:if="${error}"
                 class="alert alert-danger"
                 role="alert">

                <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>

                <span th:text="${error}">
                Unable to complete registration.
            </span>

            </div>


            <!-- Registration Form -->

            <form th:action="@{/user/register}"
                  th:object="${userRegister}"
                  method="post"
                  enctype="multipart/form-data">


                <!-- Full Name -->

                <div class="mb-3">

                    <label class="form-label" for="fullName">
                        Full Name
                    </label>

                    <div class="input-group">

                    <span class="input-group-text" aria-hidden="true">
                        <i class="bi bi-person"></i>
                    </span>

                        <input type="text"
                               th:field="*{fullName}"
                               class="form-control"
                               placeholder="Enter your full name"
                               autocomplete="name"
                               required>

                    </div>

                    <div class="hb-field-error"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                    </div>

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label" for="email">
                        Email Address
                    </label>

                    <div class="input-group">

                    <span class="input-group-text" aria-hidden="true">
                        <i class="bi bi-envelope"></i>
                    </span>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter your email"
                               autocomplete="email"
                               required>

                    </div>

                    <div class="hb-field-error"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>

                </div>


                <!-- Phone Number -->

                <div class="mb-3">

                    <label class="form-label" for="phoneNumber">
                        Phone Number
                    </label>

                    <div class="input-group">

                    <span class="input-group-text" aria-hidden="true">
                        <i class="bi bi-phone"></i>
                    </span>

                        <input type="text"
                               th:field="*{phoneNumber}"
                               class="form-control"
                               placeholder="Enter 10-digit phone number"
                               maxlength="10"
                               minlength="10"
                               inputmode="numeric"
                               autocomplete="tel"
                               required>

                    </div>

                    <div class="hb-field-error"
                         th:if="${#fields.hasErrors('phoneNumber')}"
                         th:errors="*{phoneNumber}">
                    </div>

                </div>


                <!-- Profile Image -->

                <div class="mb-3">

                    <label class="form-label" for="profileImage">
                        Profile Image
                    </label>

                    <div class="hb-upload">

                        <input type="file"
                               th:field="*{profileImage}"
                               id="profileImage"
                               class="form-control"
                               aria-describedby="imageHelp"
                               accept=".jpg,.jpeg,.png,image/jpeg,image/png">

                        <div id="imageHelp" class="form-text mt-2">
                            <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
                            JPG, JPEG or PNG only. Maximum size: 5 MB.
                        </div>

                        <img id="profilePreview"
                             class="hb-preview"
                             alt="Profile Preview">

                    </div>

                    <div class="hb-field-error"
                         th:if="${#fields.hasErrors('profileImage')}"
                         th:errors="*{profileImage}">
                    </div>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label" for="password">
                        Password
                    </label>

                    <div class="input-group">

                    <span class="input-group-text" aria-hidden="true">
                        <i class="bi bi-lock"></i>
                    </span>

                        <input type="password"
                               th:field="*{password}"
                               id="password"
                               class="form-control"
                               placeholder="Enter password"
                               autocomplete="new-password"
                               required>

                        <button type="button"
                                class="btn btn-outline-secondary"
                                aria-label="Show or hide password"
                                onclick="togglePassword('password', 'passwordIcon')">

                            <i class="bi bi-eye"
                               id="passwordIcon"
                               aria-hidden="true"></i>

                        </button>

                    </div>

                    <div class="hb-field-error"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="mb-4">

                    <label class="form-label" for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-group">

                    <span class="input-group-text" aria-hidden="true">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                        <input type="password"
                               th:field="*{confirmPassword}"
                               id="confirmPassword"
                               class="form-control"
                               placeholder="Confirm your password"
                               autocomplete="new-password"
                               required>

                        <button type="button"
                                class="btn btn-outline-secondary"
                                aria-label="Show or hide confirm password"
                                onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')">

                            <i class="bi bi-eye"
                               id="confirmPasswordIcon"
                               aria-hidden="true"></i>

                        </button>

                    </div>

                    <div class="hb-field-error"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}">
                    </div>

                </div>


                <!-- Register Button -->

                <button type="submit"
                        class="btn btn-primary btn-lg w-100">

                    <i class="bi bi-person-plus-fill" aria-hidden="true"></i>

                    Create Account

                </button>

            </form>


            <!-- Divider -->

            <div class="text-center my-4">

            <span class="text-muted">
                Already have an account?
            </span>

                <a th:href="@{/user/login}"
                   class="fw-semibold ms-1">

                    Login

                </a>

            </div>


            <!-- Home -->

            <div class="text-center">

                <a th:href="@{/}"
                   class="text-muted text-decoration-none">

                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>

                    Back to Home

                </a>

            </div>

        </div>

    </div>

</main>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    /*
     * Password show/hide
     */

    function togglePassword(inputId, iconId) {

        const password =
            document.getElementById(inputId);

        const icon =
            document.getElementById(iconId);

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        }
    }


    /*
     * Profile image preview
     */

    document
        .getElementById("profileImage")
        .addEventListener("change", function (event) {

            const file =
                event.target.files[0];

            const preview =
                document.getElementById("profilePreview");

            if (!file) {

                preview.style.display = "none";

                preview.removeAttribute("src");

                return;
            }

            /*
             * Validate file type
             */

            const allowedTypes = [
                "image/jpeg",
                "image/png"
            ];

            if (!allowedTypes.includes(file.type)) {

                alert(
                    "Only JPG, JPEG and PNG images are allowed."
                );

                event.target.value = "";

                preview.style.display = "none";

                return;
            }


            /*
             * Validate file size
             */

            const maxSize =
                5 * 1024 * 1024;

            if (file.size > maxSize) {

                alert(
                    "Profile image size must not exceed 5 MB."
                );

                event.target.value = "";

                preview.style.display = "none";

                return;
            }


            /*
             * Show preview
             */

            const reader =
                new FileReader();

            reader.onload = function (e) {

                preview.src =
                    e.target.result;

                preview.style.display =
                    "block";
            };

            reader.readAsDataURL(file);

        });

</script>

</body>

</html>
