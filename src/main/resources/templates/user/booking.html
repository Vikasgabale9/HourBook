<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Bookings</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <link th:href="@{/css/hourbook-user.css}"
          rel="stylesheet">

</head>

<body class="hb-body">

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>


<div class="hb-main">

    <div th:replace="~{user/fragments/header :: header}"></div>


    <main id="main-content" class="hb-content">

        <!-- Heading -->

        <div class="hb-page-head">

            <div>

                <h1 class="hb-title">

                    <i class="bi bi-calendar-check" aria-hidden="true"></i>

                    My Bookings

                </h1>

                <p class="hb-subtitle">

                    View and manage your ground bookings.

                </p>

            </div>


            <a th:href="@{/user/grounds}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle" aria-hidden="true"></i>

                Book a Ground

            </a>

        </div>


        <!-- No Bookings -->

        <div th:if="${bookings == null or #lists.isEmpty(bookings)}"
             class="card hb-empty">

            <i class="bi bi-calendar-x" aria-hidden="true"></i>

            <h2>

                No Bookings Found

            </h2>

            <p class="text-muted">

                You haven't booked any ground yet.

            </p>

            <div>

                <a th:href="@{/user/grounds}"
                   class="btn btn-primary">

                    Browse Grounds

                </a>

            </div>

        </div>


        <!-- Booking List -->

        <div class="hb-booking-grid"
             th:if="${bookings != null and !#lists.isEmpty(bookings)}">

            <article class="card h-100"
                     th:each="booking : ${bookings}">


                <!-- Card Header -->

                <div class="card-header
                            d-flex
                            flex-wrap
                            gap-2
                            justify-content-between
                            align-items-center">

                    <strong>

                        Booking #

                        <span th:text="${booking.id}"></span>

                    </strong>


                    <!-- PENDING -->

                    <span th:if="${booking.status.name() == 'PENDING'}"
                          class="hb-badge hb-badge--warning">

                        <i class="bi bi-hourglass-split" aria-hidden="true"></i>

                        Pending

                    </span>


                    <!-- CONFIRMED -->

                    <span th:if="${booking.status.name() == 'CONFIRMED'}"
                          class="hb-badge hb-badge--success">

                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>

                        Confirmed

                    </span>


                    <!-- CANCELLED -->

                    <span th:if="${booking.status.name() == 'CANCELLED'}"
                          class="hb-badge hb-badge--danger">

                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>

                        Cancelled

                    </span>


                    <!-- COMPLETED -->

                    <span th:if="${booking.status.name() == 'COMPLETED'}"
                          class="hb-badge hb-badge--neutral">

                        <i class="bi bi-check2-all" aria-hidden="true"></i>

                        Completed

                    </span>

                </div>


                <!-- Card Body -->

                <div class="card-body">

                    <h2 class="h4 fw-bold mb-1"
                        th:text="${booking.ground.name}">

                        Ground Name

                    </h2>


                    <p class="hb-meta mb-3">

                        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>

                        <span th:text="${booking.ground.location}"></span>

                    </p>


                    <dl class="hb-dl">

                        <!-- Booking Date -->

                        <div class="hb-dl__row">

                            <dt>

                                <i class="bi bi-calendar-event" aria-hidden="true"></i>

                                Booking Date

                            </dt>

                            <dd th:text="${#temporals.format(booking.bookingDate, 'dd MMM yyyy')}">
                            </dd>

                        </div>


                        <!-- Time -->

                        <div class="hb-dl__row">

                            <dt>

                                <i class="bi bi-clock" aria-hidden="true"></i>

                                Time

                            </dt>

                            <dd>

                                <span th:text="${#temporals.format(booking.startTime, 'hh:mm a')}">
                                </span>

                                -

                                <span th:text="${#temporals.format(booking.endTime, 'hh:mm a')}">
                                </span>

                            </dd>

                        </div>


                        <!-- Total Amount -->

                        <div class="hb-dl__row">

                            <dt>

                                <i class="bi bi-currency-rupee" aria-hidden="true"></i>

                                Total Amount

                            </dt>

                            <dd class="hb-amount">

                                ₹

                                <span th:text="${booking.totalAmount}">
                                </span>

                            </dd>

                        </div>

                    </dl>


                    <!-- Created -->

                    <p class="text-muted mb-0 mt-2">

                        <small>

                            Booked on:

                            <span th:text="${#temporals.format(booking.createdAt, 'dd MMM yyyy hh:mm a')}">
                            </span>

                        </small>

                    </p>

                </div>


                <!-- Card Footer -->

                <div class="card-footer bg-white">

                    <div class="hb-booking-actions">


                        <!-- View Ground -->

                        <a th:href="@{/user/grounds/{id}(id=${booking.ground.id})}"
                           class="btn btn-outline-primary">

                            <i class="bi bi-eye" aria-hidden="true"></i>

                            View Ground

                        </a>


                        <!-- Cancel Booking -->
                        <!-- Only PENDING or CONFIRMED -->

                        <form
                                th:if="${booking.status.name() == 'PENDING'
                                or booking.status.name() == 'CONFIRMED'}"

                                th:action="@{/user/bookings/cancel/{id}(id=${booking.id})}"

                                method="post">

                            <button
                                    type="submit"

                                    class="btn btn-outline-danger"

                                    onclick="return confirm(
                                    'Are you sure you want to cancel this booking?'
                                    )">

                                <i class="bi bi-x-circle" aria-hidden="true"></i>

                                Cancel

                            </button>

                        </form>


                        <!-- Cancelled message -->

                        <span
                                th:if="${booking.status.name() == 'CANCELLED'}"

                                class="btn btn-outline-secondary disabled"
                                aria-disabled="true">

                            <i class="bi bi-x-circle" aria-hidden="true"></i>

                            Cancelled

                        </span>


                        <!-- Completed message -->

                        <span
                                th:if="${booking.status.name() == 'COMPLETED'}"

                                class="btn btn-outline-secondary disabled"
                                aria-disabled="true">

                            <i class="bi bi-check-circle" aria-hidden="true"></i>

                            Completed

                        </span>

                    </div>

                </div>

            </article>

        </div>

    </main>


    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
