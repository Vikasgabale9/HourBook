<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Bookings</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{user/fragments/sidebar :: sidebar}"></div>


<div style="margin-left:260px;">

    <div th:replace="~{user/fragments/header :: header}"></div>


    <div class="container-fluid p-4">

        <!-- Heading -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">

                    <i class="bi bi-calendar-check text-primary"></i>

                    My Bookings

                </h2>

                <p class="text-muted mb-0">

                    View and manage your ground bookings.

                </p>

            </div>


            <a th:href="@{/user/grounds}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>

                Book a Ground

            </a>

        </div>


        <!-- No Bookings -->

        <div th:if="${bookings == null or #lists.isEmpty(bookings)}"
             class="card shadow-sm border-0">

            <div class="card-body text-center p-5">

                <i class="bi bi-calendar-x text-muted"
                   style="font-size: 60px;"></i>

                <h4 class="mt-3">

                    No Bookings Found

                </h4>

                <p class="text-muted">

                    You haven't booked any ground yet.

                </p>

                <a th:href="@{/user/grounds}"
                   class="btn btn-primary">

                    Browse Grounds

                </a>

            </div>

        </div>


        <!-- Booking List -->

        <div class="row g-4"
             th:if="${bookings != null and !#lists.isEmpty(bookings)}">

            <div class="col-lg-6"
                 th:each="booking : ${bookings}">

                <div class="card shadow-sm border-0 h-100">


                    <!-- Card Header -->

                    <div class="card-header
                                d-flex
                                justify-content-between
                                align-items-center">

                        <strong>

                            Booking #

                            <span th:text="${booking.id}"></span>

                        </strong>


                        <!-- PENDING -->

                        <span th:if="${booking.status.name() == 'PENDING'}"
                              class="badge bg-warning text-dark">

                            Pending

                        </span>


                        <!-- CONFIRMED -->

                        <span th:if="${booking.status.name() == 'CONFIRMED'}"
                              class="badge bg-success">

                            Confirmed

                        </span>


                        <!-- CANCELLED -->

                        <span th:if="${booking.status.name() == 'CANCELLED'}"
                              class="badge bg-danger">

                            Cancelled

                        </span>


                        <!-- COMPLETED -->

                        <span th:if="${booking.status.name() == 'COMPLETED'}"
                              class="badge bg-secondary">

                            Completed

                        </span>

                    </div>


                    <!-- Card Body -->

                    <div class="card-body">

                        <h4 class="fw-bold"
                            th:text="${booking.ground.name}">

                            Ground Name

                        </h4>


                        <p class="mb-2 text-muted">

                            <i class="bi bi-geo-alt-fill text-danger"></i>

                            <span th:text="${booking.ground.location}"></span>

                        </p>


                        <hr>


                        <!-- Booking Date -->

                        <p>

                            <strong>

                                <i class="bi bi-calendar-event"></i>

                                Booking Date:

                            </strong>

                            <span th:text="${#temporals.format(
                                    booking.bookingDate,
                                    'dd MMM yyyy'
                            )}">
                            </span>

                        </p>


                        <!-- Time -->

                        <p>

                            <strong>

                                <i class="bi bi-clock"></i>

                                Time:

                            </strong>

                            <span th:text="${#temporals.format(
                                    booking.startTime,
                                    'hh:mm a'
                            )}">
                            </span>

                            -

                            <span th:text="${#temporals.format(
                                    booking.endTime,
                                    'hh:mm a'
                            )}">
                            </span>

                        </p>


                        <!-- Total Amount -->

                        <p>

                            <strong>

                                <i class="bi bi-currency-rupee"></i>

                                Total Amount:

                            </strong>

                            ₹

                            <span th:text="${booking.totalAmount}">
                            </span>

                        </p>


                        <!-- Created -->

                        <p class="text-muted mb-0">

                            <small>

                                Booked on:

                                <span th:text="${#temporals.format(
                                        booking.createdAt,
                                        'dd MMM yyyy hh:mm a'
                                )}">
                                </span>

                            </small>

                        </p>

                    </div>


                    <!-- Card Footer -->

                    <div class="card-footer bg-white">

                        <div class="d-flex gap-2">


                            <!-- View Ground -->

                            <a th:href="@{/user/grounds/{id}(id=${booking.ground.id})}"
                               class="btn btn-outline-primary flex-fill">

                                <i class="bi bi-eye"></i>

                                View Ground

                            </a>


                            <!-- Cancel Booking -->
                            <!-- Only PENDING or CONFIRMED -->

                            <form
                                    th:if="${booking.status.name() == 'PENDING'
                                    or booking.status.name() == 'CONFIRMED'}"

                                    th:action="@{/user/bookings/cancel/{id}(id=${booking.id})}"

                                    method="post"

                                    class="d-inline">

                                <button
                                        type="submit"

                                        class="btn btn-outline-danger"

                                        onclick="return confirm(
                                        'Are you sure you want to cancel this booking?'
                                        )">

                                    <i class="bi bi-x-circle"></i>

                                    Cancel

                                </button>

                            </form>


                            <!-- Cancelled message -->

                            <span
                                    th:if="${booking.status.name() == 'CANCELLED'}"

                                    class="btn btn-outline-secondary disabled">

                                <i class="bi bi-x-circle"></i>

                                Cancelled

                            </span>


                            <!-- Completed message -->

                            <span
                                    th:if="${booking.status.name() == 'COMPLETED'}"

                                    class="btn btn-outline-secondary disabled">

                                <i class="bi bi-check-circle"></i>

                                Completed

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <div th:replace="~{user/fragments/footer :: footer}"></div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
