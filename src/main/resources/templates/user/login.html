<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport"
		  content="width=device-width, initial-scale=1">

	<title>User Login | HourBook</title>


	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
		  rel="stylesheet">

	<!-- Bootstrap -->

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
		  rel="stylesheet">


	<!-- Bootstrap Icons -->

	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
		  rel="stylesheet">


	<!-- HourBook User Panel design system -->

	<link th:href="@{/css/hourbook-user.css}"
		  rel="stylesheet">

</head>


<body class="hb-body">


<main class="hb-auth">

	<div class="hb-auth__card">


		<!-- ================================================= -->
		<!-- HEADER -->
		<!-- ================================================= -->

		<div class="hb-auth__head">

			<i class="bi bi-calendar-check-fill" aria-hidden="true"></i>

			<h1 class="hb-auth__brand">

				HourBook

			</h1>

			<p class="hb-auth__sub">

				User Login

			</p>

		</div>


		<!-- ================================================= -->
		<!-- BODY -->
		<!-- ================================================= -->

		<div class="hb-auth__body">


			<!-- ============================================= -->
			<!-- Registration Success -->
			<!-- ============================================= -->

			<div th:if="${param.registered}"
				 class="alert alert-success"
				 role="status">

				<i class="bi bi-check-circle-fill me-2" aria-hidden="true"></i>

				Registration successful.
				Please login to continue.

			</div>


			<!-- ============================================= -->
			<!-- Login Error -->
			<!-- ============================================= -->

			<div th:if="${error}"
				 class="alert alert-danger"
				 role="alert">

				<i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>

				<span th:text="${error}">
                Invalid login details.
            </span>

			</div>


			<!-- ============================================= -->
			<!-- Login Form -->
			<!-- ============================================= -->

			<form th:action="@{/user/login}"
				  th:object="${loginRequest}"
				  method="post">

				<!-- Login ID -->

				<div class="mb-3">

					<label class="form-label" for="loginId">
						Email or Phone Number
					</label>

					<div class="input-group">

                    <span class="input-group-text" aria-hidden="true">
                        <i class="bi bi-person"></i>
                    </span>

						<input type="text"
							   th:field="*{loginId}"
							   class="form-control"
							   placeholder="Enter email or phone number"
							   autocomplete="username"
							   required>

					</div>

					<div class="hb-field-error"
						 th:if="${#fields.hasErrors('loginId')}"
						 th:errors="*{loginId}">
					</div>

				</div>


				<!-- Password -->

				<div class="mb-3">

					<label class="form-label" for="password">
						Password
					</label>

					<div class="input-group">

                    <span class="input-group-text" aria-hidden="true">
                        <i class="bi bi-lock"></i>
                    </span>

						<input type="password"
							   th:field="*{password}"
							   id="password"
							   class="form-control"
							   placeholder="Enter password"
							   autocomplete="current-password"
							   required>

						<button type="button"
								class="btn btn-outline-secondary"
								aria-label="Show or hide password"
								onclick="togglePassword()">

							<i class="bi bi-eye"
							   id="passwordIcon"
							   aria-hidden="true"></i>

						</button>

					</div>

					<div class="hb-field-error"
						 th:if="${#fields.hasErrors('password')}"
						 th:errors="*{password}">
					</div>

				</div>


				<!-- General error -->

				<div th:if="${error}"
					 class="alert alert-danger"
					 role="alert">

					<i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>

					<span th:text="${error}">
                    Invalid login details.
                </span>

				</div>


				<!-- Login button -->

				<button type="submit"
						class="btn btn-primary btn-lg w-100">

					<i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>

					Login

				</button>

			</form>


			<!-- ============================================= -->
			<!-- Divider -->
			<!-- ============================================= -->

			<div class="hb-divider">

            <span>
                OR
            </span>

			</div>


			<!-- ============================================= -->
			<!-- Register -->
			<!-- ============================================= -->

			<div class="text-center">

            <span class="text-muted">

                Don't have an account?

            </span>


				<a th:href="@{/user/register}"
				   class="fw-semibold ms-1">

					Create Account

				</a>

			</div>


			<!-- ============================================= -->
			<!-- Home -->
			<!-- ============================================= -->

			<div class="text-center mt-3">

				<a th:href="@{/}"
				   class="text-muted text-decoration-none">

					<i class="bi bi-arrow-left me-1" aria-hidden="true"></i>

					Back to Home

				</a>

			</div>


		</div>

	</div>

</main>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<script>

	function togglePassword() {

		const password =
				document.getElementById("password");

		const icon =
				document.getElementById("passwordIcon");


		if (password.type === "password") {

			password.type = "text";

			icon.classList.remove("bi-eye");

			icon.classList.add("bi-eye-slash");

		} else {

			password.type = "password";

			icon.classList.remove("bi-eye-slash");

			icon.classList.add("bi-eye");

		}

	}

</script>


</body>

</html>
