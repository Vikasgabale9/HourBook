<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>User Login | HourBook</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">


    <style>

        body {

            background: #f5f7fb;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .login-card {

            width: 420px;

            border: none;

            border-radius: 18px;

            overflow: hidden;

            background: white;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);

        }


        .login-header {

            background: #2563eb;

            color: white;

            text-align: center;

            padding: 30px 20px;

        }


        .logo-icon {

            font-size: 48px;

            margin-bottom: 5px;

        }


        .brand-name {

            font-size: 30px;

            font-weight: 700;

        }


        .login-subtitle {

            opacity: .9;

            margin-top: 4px;

        }


        .login-body {

            padding: 32px;

        }


        .form-label {

            font-weight: 600;

        }


        .input-group-text {

            background: white;

            border-right: none;

        }


        .input-group .form-control {

            border-left: none;

        }


        .form-control {

            height: 48px;

            border-radius: 10px;

        }


        .input-group .form-control {

            border-radius: 0 10px 10px 0;

        }


        .input-group-text {

            border-radius: 10px 0 0 10px;

        }


        .login-button {

            height: 48px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 16px;

        }


        .register-link {

            text-decoration: none;

            font-weight: 600;

        }


        .forgot-link {

            text-decoration: none;

            font-size: 14px;

        }


        .divider {

            display: flex;

            align-items: center;

            text-align: center;

            color: #6c757d;

            margin: 24px 0;

        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            border-bottom: 1px solid #dee2e6;

        }


        .divider span {

            padding: 0 12px;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="card login-card">


    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <div class="login-header">

        <div class="logo-icon">

            <i class="bi bi-calendar-check-fill"></i>

        </div>


        <div class="brand-name">

            HourBook

        </div>


        <div class="login-subtitle">

            User Login

        </div>

    </div>


    <!-- ================================================= -->
    <!-- BODY -->
    <!-- ================================================= -->

    <div class="login-body">


        <!-- ============================================= -->
        <!-- Registration Success -->
        <!-- ============================================= -->

        <div th:if="${param.registered}"
             class="alert alert-success">

            <i class="bi bi-check-circle-fill me-2"></i>

            Registration successful.
            Please login to continue.

        </div>


        <!-- ============================================= -->
        <!-- Login Error -->
        <!-- ============================================= -->

        <div th:if="${error}"
             class="alert alert-danger">

            <i class="bi bi-exclamation-triangle-fill me-2"></i>

            <span th:text="${error}">
                Invalid login details.
            </span>

        </div>


        <!-- ============================================= -->
        <!-- Login Form -->
        <!-- ============================================= -->

		<form th:action="@{/user/login}"
		      th:object="${loginRequest}"
		      method="post">

		    <!-- Login ID -->

		    <div class="mb-3">

		        <label class="form-label">
		            Email or Phone Number
		        </label>

		        <div class="input-group">

		            <span class="input-group-text">
		                <i class="bi bi-person"></i>
		            </span>

		            <input type="text"
		                   th:field="*{loginId}"
		                   class="form-control"
		                   placeholder="Enter email or phone number"
		                   autocomplete="username"
		                   required>

		        </div>

		        <div class="text-danger small mt-1"
		             th:if="${#fields.hasErrors('loginId')}"
		             th:errors="*{loginId}">
		        </div>

		    </div>


		    <!-- Password -->

		    <div class="mb-3">

		        <label class="form-label">
		            Password
		        </label>

		        <div class="input-group">

		            <span class="input-group-text">
		                <i class="bi bi-lock"></i>
		            </span>

		            <input type="password"
		                   th:field="*{password}"
		                   id="password"
		                   class="form-control"
		                   placeholder="Enter password"
		                   autocomplete="current-password"
		                   required>

		            <button type="button"
		                    class="btn btn-outline-secondary"
		                    onclick="togglePassword()">

		                <i class="bi bi-eye"
		                   id="passwordIcon"></i>

		            </button>

		        </div>

		        <div class="text-danger small mt-1"
		             th:if="${#fields.hasErrors('password')}"
		             th:errors="*{password}">
		        </div>

		    </div>


		    <!-- General error -->

		    <div th:if="${error}"
		         class="alert alert-danger">

		        <i class="bi bi-exclamation-triangle-fill me-2"></i>

		        <span th:text="${error}">
		            Invalid login details.
		        </span>

		    </div>


		    <!-- Login button -->

		    <button type="submit"
		            class="btn btn-primary w-100 login-button">

		        <i class="bi bi-box-arrow-in-right me-2"></i>

		        Login

		    </button>

		</form>


        <!-- ============================================= -->
        <!-- Divider -->
        <!-- ============================================= -->

        <div class="divider">

            <span>
                OR
            </span>

        </div>


        <!-- ============================================= -->
        <!-- Register -->
        <!-- ============================================= -->

        <div class="text-center">

            <span class="text-muted">

                Don't have an account?

            </span>


            <a th:href="@{/user/register}"
               class="register-link ms-1">

                Create Account

            </a>

        </div>


        <!-- ============================================= -->
        <!-- Home -->
        <!-- ============================================= -->

        <div class="text-center mt-3">

            <a th:href="@{/}"
               class="text-muted text-decoration-none">

                <i class="bi bi-arrow-left me-1"></i>

                Back to Home

            </a>

        </div>


    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        const icon =
            document.getElementById("passwordIcon");


        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        }

    }

</script>


</body>

</html>
