<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>User Login | HourBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body{

            background:#f5f7fb;

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .login-card{

            width:430px;

            border:none;

            border-radius:16px;

            overflow:hidden;

            box-shadow:0 10px 35px rgba(0,0,0,.12);

        }

        .card-header{

            background:#2563eb;

            color:white;

            text-align:center;

            padding:30px;

        }

        .logo{

            font-size:40px;

        }

        .login-title{

            font-size:28px;

            font-weight:bold;

            margin-top:10px;

        }

        .form-control{

            height:48px;

            border-radius:10px;

        }

        .btn-login{

            height:48px;

            border-radius:10px;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="card login-card">

    <div class="card-header">

        <div class="logo">

            <i class="bi bi-calendar-check-fill"></i>

        </div>

        <div class="login-title">

            HourBook

        </div>

        <div>

            User Login

        </div>

    </div>

    <div class="card-body p-4">

        <div
             th:if="${error}"
             class="alert alert-danger">

            <span th:text="${error}"></span>

        </div>

        <form
              th:action="@{/user/login}"
              method="post">

            <div class="mb-3">

                <label class="form-label">

                    Email / Phone Number

                </label>

                <input
                       type="text"

                       name="loginId"

                       class="form-control"

                       placeholder="Enter Email or Phone"

                       required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <input
                       type="password"

                       name="password"

                       class="form-control"

                       placeholder="Enter Password"

                       required>

            </div>

            <button
                    type="submit"

                    class="btn btn-primary btn-login w-100">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

        <hr>

        <div class="text-center">

            Don't have an account?

            <a
               href="/user/register">

                Register

            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
