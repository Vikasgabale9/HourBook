<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | HourBook</title>

    <!-- Do NOT load admin-dark.css here: it overrides the input colours -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#070B1A;
            --ink:#F8FAFC;
            --ink-soft:#A5B0C8;
            --violet:#7C3AED;
            --blue:#3B82F6;
            --cyan:#22D3EE;
            --amber:#FBBF24;
            --line:rgba(255,255,255,.12);
            --display:'Sora','Segoe UI',system-ui,sans-serif;
            --body:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
        }
        *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
        html{ color-scheme:dark; -webkit-text-size-adjust:100%; }

        body{
            min-height:100vh; min-height:100dvh;
            display:grid;
            grid-template-columns:1.1fr 1fr;
            font-family:var(--body);
            font-size:15px; line-height:1.55;
            color:var(--ink);
            background:var(--bg);
            -webkit-font-smoothing:antialiased;
        }

        /* ---------- Left: showcase ---------- */
        .showcase{
            position:relative; overflow:hidden;
            display:flex; flex-direction:column; justify-content:space-between;
            padding:48px 56px;
            background:
                radial-gradient(60% 50% at 20% 10%, rgba(124,58,237,.55), transparent 70%),
                radial-gradient(55% 55% at 90% 90%, rgba(34,211,238,.35), transparent 70%),
                linear-gradient(160deg,#0B1030,#070B1A 70%);
        }
        .brand{
            display:flex; align-items:center; gap:12px;
            font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:-.02em;
        }
        .brand-mark{
            width:36px; height:36px; border-radius:11px;
            display:grid; place-items:center;
            background:linear-gradient(135deg,var(--blue),var(--violet));
            box-shadow:0 0 28px rgba(124,58,237,.7);
        }
        .brand-mark svg{ width:20px; height:20px; }

        .pitch h1{
            font-family:var(--display); font-weight:800;
            font-size:clamp(34px,4vw,54px); line-height:1.05; letter-spacing:-.035em;
            max-width:11ch; margin-bottom:16px;
            background:linear-gradient(120deg,#fff 30%,#C4B5FD 70%,var(--cyan));
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        }
        .pitch p{ max-width:38ch; color:var(--ink-soft); font-size:16px; }

        /* The memorable element: a live-looking hourly slot grid */
        .slots{
            display:grid; grid-template-columns:repeat(6,1fr); gap:8px;
            max-width:440px; margin-top:34px;
        }
        .slot{
            padding:9px 0; border-radius:10px; text-align:center;
            font:500 12px var(--body); color:var(--ink-soft);
            background:rgba(255,255,255,.05);
            border:1px solid var(--line);
        }
        .slot.booked{
            color:#fff; border-color:transparent;
            background:linear-gradient(135deg,var(--blue),var(--violet));
            box-shadow:0 6px 18px -6px rgba(124,58,237,.9);
        }
        .slot.hot{
            color:#1a1204; font-weight:600; border-color:transparent;
            background:var(--amber);
            box-shadow:0 0 22px rgba(251,191,36,.55);
            animation:pulse 2.6s ease-in-out infinite;
        }
        @keyframes pulse{ 50%{ box-shadow:0 0 34px rgba(251,191,36,.9); } }

        /* ---------- Right: form ---------- */
        .panel{
            display:flex; align-items:center; justify-content:center;
            padding:40px 24px;
            background:
                radial-gradient(60% 40% at 100% 0%, rgba(59,130,246,.18), transparent 70%),
                #0A0F22;
            border-left:1px solid var(--line);
        }
        .login{ width:100%; max-width:380px; }
        .login h2{
            font-family:var(--display); font-weight:700;
            font-size:30px; letter-spacing:-.025em; margin-bottom:6px;
        }
        .login .sub{ color:var(--ink-soft); margin-bottom:30px; }

        .field{ margin-bottom:18px; }
        label{ display:block; margin-bottom:8px; font-size:13.5px; font-weight:600; color:#DCE3F2; }

        .control{ position:relative; }
        .control svg.lead{
            position:absolute; left:14px; top:50%; transform:translateY(-50%);
            width:18px; height:18px; color:#7886A3; pointer-events:none;
            transition:color .16s;
        }
        input{
            width:100%; min-height:52px;
            padding:13px 46px 13px 44px;
            font:inherit; font-size:15px;
            color:#fff; caret-color:var(--cyan);
            background:rgba(255,255,255,.06);
            border:1.5px solid var(--line);
            border-radius:14px;
            transition:border-color .16s, box-shadow .16s, background .16s;
        }
        input::placeholder{ color:#6F7C98; }
        input:focus{
            outline:none;
            background:rgba(255,255,255,.09);
            border-color:var(--blue);
            box-shadow:0 0 0 4px rgba(59,130,246,.25);
        }
        .control:focus-within svg.lead{ color:var(--cyan); }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus{
            -webkit-text-fill-color:#fff;
            caret-color:var(--cyan);
            -webkit-box-shadow:0 0 0 1000px #17203A inset;
            transition:background-color 9999s ease-in-out 0s;
        }

        .toggle{
            position:absolute; right:6px; top:50%; transform:translateY(-50%);
            width:40px; height:40px; display:grid; place-items:center;
            background:none; border:none; border-radius:10px;
            color:#7886A3; cursor:pointer;
        }
        .toggle:hover{ color:#fff; background:rgba(255,255,255,.08); }
        .toggle svg{ width:19px; height:19px; }

        .submit{
            width:100%; min-height:54px; margin-top:8px;
            font:700 16px var(--display); letter-spacing:-.01em; color:#fff;
            border:none; border-radius:14px; cursor:pointer;
            background:linear-gradient(120deg,var(--blue),var(--violet) 60%,#A855F7);
            box-shadow:0 14px 30px -10px rgba(124,58,237,.9), inset 0 1px 0 rgba(255,255,255,.3);
            transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
        }
        .submit:hover{ filter:brightness(1.12); box-shadow:0 18px 38px -10px rgba(124,58,237,1), inset 0 1px 0 rgba(255,255,255,.3); }
        .submit:active{ transform:scale(.98); }
        :focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }

        .error{
            margin-top:18px; padding:12px 14px;
            border-radius:12px; text-align:center;
            font-size:13.5px; font-weight:600; overflow-wrap:anywhere;
            color:#FCA5A5; background:rgba(239,68,68,.14);
            border:1px solid rgba(239,68,68,.5);
        }
        .foot{ margin-top:34px; font-size:12.5px; color:#6F7C98; text-align:center; }

        /* ---------- Responsive ---------- */
        @media (max-width:900px){
            body{ grid-template-columns:1fr; }
            .showcase{ padding:28px 24px; gap:0; }
            .pitch, .slots{ display:none; }
            .panel{ border-left:none; align-items:flex-start; padding-top:28px; }
        }
        @media (prefers-reduced-motion:reduce){
            *,*::before,*::after{ animation:none !important; transition-duration:.01ms !important; }
        }
    </style>
</head>
<body>

<section class="showcase" aria-hidden="true">
    <div class="brand">
        <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </span>
        HourBook
    </div>

    <div class="pitch">
        <h1>Every hour, under control.</h1>
        <p>Manage grounds, vendors and bookings from one place.</p>
        <div class="slots" id="slots"></div>
    </div>

    <div></div>
</section>

<main class="panel">
    <div class="login">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to the HourBook admin panel.</p>

        <form th:action="@{/admin/login}" method="post">

            <div class="field">
                <label for="adminEmail">Email</label>
                <div class="control">
                    <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
                    <input id="adminEmail" type="email" name="email"
                           placeholder="admin@hourbook.com"
                           autocomplete="username" required>
                </div>
            </div>

            <div class="field">
                <label for="adminPassword">Password</label>
                <div class="control">
                    <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                    <input id="adminPassword" type="password" name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle" id="toggle" aria-label="Show password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit">Sign in</button>
        </form>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <p class="foot">Authorised administrators only</p>
    </div>
</main>

<script>
    // Hourly slot grid (decorative): 6 AM to 5 PM
    (function(){
        var box = document.getElementById('slots');
        if(!box) return;
        var booked = [1,2,3,7,8,10,13,14,16,17], hot = [5];
        for(var i=0;i<18;i++){
            var h = 6 + i, d = document.createElement('div');
            d.className = 'slot' + (booked.indexOf(i)>-1 ? ' booked' : '') + (hot.indexOf(i)>-1 ? ' hot' : '');
            d.textContent = ((h+11)%12+1) + (h<12||h>=24 ? 'am' : 'pm');
            box.appendChild(d);
        }
    })();

    // Show / hide password
    document.getElementById('toggle').addEventListener('click', function(){
        var p = document.getElementById('adminPassword');
        var show = p.type === 'password';
        p.type = show ? 'text' : 'password';
        this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
</script>
</body>
</html>
