<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Ground</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dark.css}">
</head>

<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div th:replace="~{admin/fragments/header :: header}"></div>

<div class="content">

    <div class="page-header">
        <h2>Add Ground</h2>
        <a th:href="@{/admin/grounds}" class="add-btn">← Back to Grounds</a>
    </div>

    <div class="table-container">

        <form th:action="@{/admin/grounds/save}"
              method="post"
              enctype="multipart/form-data">

            <!-- Ground Name -->
            <div class="form-group">
                <label for="groundName">Ground Name</label>
                <input id="groundName"
                       type="text" name="name" required
                       placeholder="Enter ground name">
            </div>

            <!-- Location -->
            <div class="form-group">
                <label for="groundLocation">Location</label>
                <input id="groundLocation"
                       type="text" name="location" required
                       placeholder="Enter location">
            </div>

            <!-- Sport -->
            <div class="form-group">
                <label for="groundSports">Sport</label>
                <input id="groundSports"
                       type="text" name="sports" required
                       placeholder="e.g. Cricket, Football">
            </div>

            <!-- Price -->
            <div class="form-group">
                <label for="groundPrice">Price Per Hour (₹)</label>
                <input id="groundPrice"
                       type="number" name="pricePerHour" required
                       placeholder="Enter price" min="0">
            </div>

            <!-- Ground Type -->
            <div class="form-group">
                <label for="groundType">Ground Type</label>
                <select id="groundType" name="type" required>
                    <option value="">Select Ground Type</option>
                    <option value="GRASS">Grass</option>
                    <option value="TURF_ASTROTURF">Turf / Astroturf</option>
                    <option value="CLAY">Clay</option>
                    <option value="SYNTHETIC_MATTING">Synthetic Matting</option>
                </select>
            </div>

            <!-- Vendor -->
            <div class="form-group">
                <label for="groundVendor">Vendor</label>
                <select id="groundVendor" name="vendorId" required>
                    <option value="">Select Vendor</option>
                    <option th:each="vendor : ${vendors}"
                            th:value="${vendor.id}"
                            th:text="${vendor.phoneNumber}">
                    </option>
                </select>
            </div>

            <!-- Ground Operating Hours -->
            <div class="form-group">
                <label for="openingTime">Opening Time</label>
                <input id="openingTime" type="time" name="openingTime" required>
            </div>

            <div class="form-group">
                <label for="closingTime">Closing Time</label>
                <input id="closingTime" type="time" name="closingTime" required>
            </div>

            <div class="form-group">
                <label for="slotDuration">Booking Slot Duration (Minutes)</label>
                <input id="slotDuration"
                       type="number" name="slotDurationMinutes"
                       value="60" min="15" step="15" required>
            </div>

            <!-- Amenities -->
            <div class="form-group">
                <label>Amenities</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="amenities" value="FLOODLIGHTS">
                        Flood Lights
                    </label>
                    <label>
                        <input type="checkbox" name="amenities" value="LOCKERROOMS">
                        Locker Rooms
                    </label>
                    <label>
                        <input type="checkbox" name="amenities" value="PARKING">
                        Parking
                    </label>
                    <label>
                        <input type="checkbox" name="amenities" value="DRINKINGWATER">
                        Drinking Water
                    </label>
                    <label>
                        <input type="checkbox" name="amenities" value="CAFETERIA">
                        Cafeteria
                    </label>
                    <label>
                        <input type="checkbox" name="amenities" value="EQUIPMENTHIRE">
                        Equipment Hire
                    </label>
                </div>
            </div>

            <!-- Images -->
            <div class="form-group">
                <label for="groundImages">Ground Images</label>
                <input id="groundImages"
                       type="file" name="images" multiple accept="image/*">
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="submit" class="btn-success">Save Ground</button>
                <a th:href="@{/admin/grounds}" class="btn-danger">Cancel</a>
            </div>

        </form>

    </div>

</div>

<div th:replace="~{admin/fragments/footer :: footer}"></div>

</body>
</html>
