<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ground Images</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dark.css}">
</head>

<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div th:replace="~{admin/fragments/header :: header}"></div>

<div class="content">

    <div class="page-header">
        <h2>Images — <span th:text="${ground.name}"></span></h2>
        <a th:href="@{/admin/grounds}" class="add-btn">← Back to Grounds</a>
    </div>

    <!-- Empty State -->
    <div th:if="${ground.imageUrls == null || #lists.isEmpty(ground.imageUrls)}"
         class="table-container empty-state">
        <p class="empty-title">No Images Available</p>
        <p class="empty-sub">No images have been uploaded for this ground yet.</p>
    </div>

    <!-- Image Gallery -->
    <div class="image-grid"
         th:if="${ground.imageUrls != null && !#lists.isEmpty(ground.imageUrls)}">

        <div class="image-card" th:each="image : ${ground.imageUrls}">
            <img th:src="${image}" class="gallery-image" alt="Ground image">
        </div>

    </div>

</div>

<div th:replace="~{admin/fragments/footer :: footer}"></div>

</body>
</html>
